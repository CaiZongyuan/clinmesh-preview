<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClinMesh 门诊工作台原型</title>
<!--
  PROTOTYPE — reference only, not production code. Kept in main so implementation work can consult it.
  Question: 无感 Clinical Copilot 在门诊医生工作台里应该长什么样、用起来是否真实？
  Layout (variant A chosen): 候诊队列 rail | 问诊记录 (resizable, collapsible) | 病例工作区 | 临床助手 (resizable).
  Voice: 持续收音 (toggle, VAD 自动断句) / 按住说话 (hold button or Space; 上移取消). ASR + patient TTS are simulated.
  Copilot: pi-durable session rendered Claude-desktop style (after pi-pocket / pi-web) + 上下文 view (after dsh-context).
  Visual language from D:\Projects\Agents\clinmesh (packages/ui tokens, docs/ui/design.md). Golden Case 1 is scripted.
  All clinical state is in memory; only layout widths / theme / font size / panel toggles are remembered in localStorage.
-->
<style>
:root {
  --background: #f5f6f7; --foreground: #0f1115; --card: #ffffff; --popover: #ffffff;
  --primary: #0f1115; --primary-fg: #ffffff; --secondary: #ebeef2; --muted: #f5f6f7; --muted-fg: #61666b;
  --accent: #e9f0fc; --accent-fg: #175fb8; --destructive: #b4232c; --success: #187442; --warning: #875b0c; --info: #1764c0;
  --border: #dce0e5; --input: #7e8793; --scrim: rgb(15 17 21 / .4); --shadow-pop: 0 10px 30px rgb(15 17 21 / .16);
  --c1: #64748b; --c2: #7c5cc4; --c3: #0f8a8a; --c4: #1764c0; --c5: #b7791f; --c6: #187442; --c7: #8a94a6;
  --ui: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: SFMono-Regular, Consolas, "Liberation Mono", monospace;
  --scale: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --background: #151517; --foreground: #f9fafb; --card: #232324; --popover: #2c2c2e;
  --primary: #f9fafb; --primary-fg: #0f1115; --secondary: #43454a; --muted: #2c2c2e; --muted-fg: #cfd3d6;
  --accent: #24344c; --accent-fg: #a7caff; --destructive: #ff9b9b; --success: #7ddba4; --warning: #f4ca7b; --info: #8dbbff;
  --border: #ffffff1f; --input: #848b96; --scrim: rgb(0 0 0 / .55); --shadow-pop: 0 10px 30px rgb(0 0 0 / .45);
  --c1: #94a3b8; --c2: #b39dff; --c3: #4fd1c5; --c4: #8dbbff; --c5: #f4ca7b; --c6: #7ddba4; --c7: #aab4c3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --background: #151517; --foreground: #f9fafb; --card: #232324; --popover: #2c2c2e;
  --primary: #f9fafb; --primary-fg: #0f1115; --secondary: #43454a; --muted: #2c2c2e; --muted-fg: #cfd3d6;
  --accent: #24344c; --accent-fg: #a7caff; --destructive: #ff9b9b; --success: #7ddba4; --warning: #f4ca7b; --info: #8dbbff;
  --border: #ffffff1f; --input: #848b96; --scrim: rgb(0 0 0 / .55); --shadow-pop: 0 10px 30px rgb(0 0 0 / .45);
  --c1: #94a3b8; --c2: #b39dff; --c3: #4fd1c5; --c4: #8dbbff; --c5: #f4ca7b; --c6: #7ddba4; --c7: #aab4c3; color-scheme: dark; }
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--background); color: var(--foreground); font: 14px/1.5 var(--ui); overflow: hidden; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
#root, #float-root { zoom: var(--scale); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-weight: 600; }
.ic { flex: none; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.xs { font-size: 12px; } .xxs { font-size: 11px; }
.mf { color: var(--muted-fg); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row.nowrap { flex-wrap: nowrap; } .row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rot { transition: transform .15s; } .rot.open { transform: rotate(90deg); }

/* primitives (shadcn-like, clinmesh tokens) */
.btn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover:not([disabled]) { background: var(--muted); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 12px; gap: 4px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover:not([disabled]) { background: var(--primary); opacity: .88; }
.btn.primary.notready { background: transparent; color: var(--foreground); border: 1px dashed var(--input); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.dest { color: var(--destructive); }
.btn.info { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, transparent); }
.btn.w100 { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.ibtn { width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted-fg); flex: none; padding: 0; }
.ibtn:hover:not([disabled]) { background: var(--muted); color: var(--foreground); }
.ibtn.xs { width: 22px; height: 22px; border-radius: 5px; }
.ibtn.on { color: var(--info); }
.ibtn[disabled] { opacity: .4; cursor: not-allowed; }
.lnk { border: 0; background: transparent; padding: 0; color: var(--info); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
.lnk:hover { text-decoration: underline; }
.badge { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.badge.outline { border-color: var(--border); }
.badge.secondary { background: var(--secondary); }
.badge.dest { background: var(--destructive); color: var(--card); }
.badge.warn { background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning); }
.badge.warn-o { border-color: color-mix(in srgb, var(--warning) 45%, transparent); color: var(--warning); }
.badge.ok { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
.badge.info { border-color: color-mix(in srgb, var(--info) 40%, transparent); color: var(--info); }
.badge.crit { background: color-mix(in srgb, var(--destructive) 12%, transparent); color: var(--destructive); }
.badge.tiny { height: 18px; padding: 0 5px; font-size: 11px; }
.input { width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); padding: 0 10px; outline: none; }
.input:focus { border-color: var(--input); }
.input.sm { height: 28px; font-size: 13px; }
textarea.input { height: auto; min-height: 56px; padding: 7px 10px 22px; resize: vertical; line-height: 1.6; display: block; }
select.input { width: auto; max-width: 100%; padding: 0 6px; }
.card { background: var(--card); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--border); min-width: 0; }
.sect { padding: 12px 14px; }
.sect-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.sect-h h3 { font-size: 14px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.li { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 7px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--border); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted-fg); }
.dot.ok { background: var(--success); } .dot.warn { background: var(--warning); } .dot.info { background: var(--info); } .dot.crit { background: var(--destructive); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted-fg); padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 12px; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tblwrap { overflow-x: auto; }
.empty { padding: 14px; text-align: center; color: var(--muted-fg); font-size: 12.5px; border: 1px dashed var(--border); border-radius: 8px; }
.seg2 { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--muted); box-shadow: inset 0 0 0 1px var(--border); flex: none; }
.seg2 button { height: 26px; padding: 0 10px; border: 0; background: transparent; border-radius: 5px; font-size: 12.5px; color: var(--muted-fg); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; white-space: nowrap; }
.seg2.xs button { height: 22px; padding: 0 7px; font-size: 12px; }
.seg2 button.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .08), inset 0 0 0 1px var(--border); font-weight: 500; }
.switch { width: 28px; height: 16px; border-radius: 99px; background: var(--secondary); position: relative; border: 0; cursor: pointer; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
.switch.on { background: var(--info); } .switch.on::after { transform: translateX(12px); }
kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; box-shadow: inset 0 -1px 0 var(--border), inset 0 0 0 1px var(--border); background: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 26px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip:hover:not([disabled]) { border-color: var(--info); color: var(--info); }
.chip.used { color: var(--muted-fg); background: var(--muted); }
.chip[disabled] { opacity: .5; cursor: default; }
.floating { position: fixed; z-index: 90; }
.pop { background: var(--popover); border-radius: 10px; box-shadow: var(--shadow-pop), inset 0 0 0 1px var(--border); padding: 6px; min-width: 180px; max-height: 70vh; overflow-y: auto; }
.menu { display: flex; flex-direction: column; }
.menu > button { display: flex; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; width: 100%; }
.menu > button:hover, .menu > button.on { background: var(--muted); }
.menu-h { font-size: 11px; color: var(--muted-fg); padding: 6px 8px 4px; }
.menu-note { font-size: 11.5px; color: var(--muted-fg); padding: 7px 8px 4px; border-top: 1px solid var(--border); margin-top: 4px; line-height: 1.55; }
.combo { position: relative; display: inline-flex; align-items: center; flex: 1 1 220px; min-width: 0; }
.combo .input { padding-left: 30px; }
.combo-i { position: absolute; left: 9px; color: var(--muted-fg); display: inline-flex; pointer-events: none; }
.lb { background: var(--popover); border-radius: 8px; box-shadow: var(--shadow-pop), inset 0 0 0 1px var(--border); padding: 4px; max-height: 300px; overflow-y: auto; }
.opt { padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.opt.on { background: var(--muted); }

/* agent presence (clinmesh agent-workspace-glow / agent-action-feedback) */
[data-agent="active"], [data-agent="recent"] { position: relative; }
[data-agent="active"] { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--info) 35%, transparent), 0 0 16px color-mix(in srgb, var(--info) 16%, transparent) !important; }
[data-agent="active"]::after { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 2;
  background: conic-gradient(from var(--ang), var(--info), color-mix(in srgb, var(--info) 30%, transparent) 30%, transparent 55%, var(--info));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 1.8s linear infinite; }
[data-agent="recent"] { box-shadow: 0 0 0 1px color-mix(in srgb, var(--info) 35%, transparent) !important; transition: box-shadow .6s ease-out; }
@keyframes spin { to { --ang: 360deg; } }
.draft-field { position: relative; border-radius: 6px; }
.draft-field.agent textarea { border-style: dashed; border-color: color-mix(in srgb, var(--info) 60%, transparent); }
.abadge { position: absolute; right: 6px; top: 6px; z-index: 3; }
.review { border: 1px solid color-mix(in srgb, var(--info) 45%, transparent); background: color-mix(in srgb, var(--info) 7%, transparent); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.redline { border: 1px solid var(--destructive); border-radius: 8px; padding: 10px 12px; color: var(--destructive); background: color-mix(in srgb, var(--destructive) 7%, transparent); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.warnline { border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent); border-radius: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--warning) 8%, transparent); font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
.spin-i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--info) 25%, transparent); border-top-color: var(--info); display: inline-block; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.caret::after { content: "▍"; color: var(--info); animation: blink 1s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }

/* shell */
.app { height: calc(100dvh / var(--scale)); display: flex; flex-direction: column; }
.top { height: 48px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--card); box-shadow: inset 0 -1px 0 var(--border); }
.logo { width: 22px; height: 22px; border-radius: 5px; background: var(--info); display: grid; place-items: center; color: var(--card); font-weight: 700; font-size: 15px; flex: none; }
.top h1 { font-size: 15px; white-space: nowrap; }
.top .ctx { font-size: 12px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
.status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; min-width: 0; margin-right: 6px; }
.doc-chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 8px 0 4px; border-radius: 99px; border: 0; background: transparent; cursor: pointer; }
.doc-chip:hover { background: var(--muted); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.wb { flex: 1; min-height: 0; display: grid; grid-template-columns: 52px min(var(--wc), 30vw) 12px minmax(440px, 1fr) 12px min(var(--wa), 34vw); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); }
.wb.noai { grid-template-columns: 52px min(var(--wc), 34vw) 12px minmax(440px, 1fr); }
.wb > * { min-height: 0; min-width: 0; }
.splitter { position: relative; cursor: col-resize; touch-action: none; outline: none; }
.splitter::after { content: ""; position: absolute; top: 10px; bottom: 10px; left: 5px; width: 2px; border-radius: 2px; background: transparent; transition: background .15s; }
.splitter:hover::after, .splitter.drag::after, .splitter:focus-visible::after { background: color-mix(in srgb, var(--info) 70%, transparent); }
.splitter .grip { position: absolute; top: 50%; left: 1px; width: 10px; height: 30px; margin-top: -15px; border-radius: 4px; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); opacity: 0; transition: opacity .15s; display: grid; place-items: center; color: var(--muted-fg); z-index: 1; }
.splitter:hover .grip, .splitter.drag .grip, .splitter:focus-visible .grip { opacity: 1; }
.size-tip { position: absolute; top: 50%; left: 14px; transform: translateY(22px); background: var(--primary); color: var(--primary-fg); font: 11px var(--mono); padding: 2px 6px; border-radius: 4px; white-space: nowrap; z-index: 5; }
.agent-split .size-tip { left: auto; right: 14px; }

/* queue rail */
.rail { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-right: 8px; }
.av-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; position: relative; }
.av-btn.on { background: var(--accent); color: var(--accent-fg); border-color: color-mix(in srgb, var(--info) 45%, transparent); font-weight: 600; }
.av-btn .n { position: absolute; right: -4px; bottom: -4px; font: 10px var(--mono); background: var(--secondary); border-radius: 4px; padding: 0 3px; color: var(--muted-fg); }
.rail .sep { width: 24px; height: 1px; background: var(--border); }
.queue-pop { width: 300px; }
.qtabs { display: grid; grid-template-columns: repeat(3, 1fr); box-shadow: inset 0 -1px 0 var(--border); margin-bottom: 4px; }
.qtabs button { height: 32px; border: 0; background: transparent; font-size: 13px; cursor: pointer; color: var(--muted-fg); }
.qtabs button.on { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--foreground); font-weight: 500; }
.qitem { padding: 8px; display: flex; gap: 10px; border-radius: 6px; font-size: 13px; align-items: flex-start; }
.qitem.on { background: var(--accent); }
.qitem .no { font-family: var(--mono); color: var(--muted-fg); width: 18px; padding-top: 1px; }

/* panes */
.pane { display: flex; flex-direction: column; overflow: hidden; }
.pane-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--border); min-height: 50px; flex: none; }
.pane-h h3 { font-size: 14px; white-space: nowrap; }
.pane-b { flex: 1; overflow-y: auto; min-height: 0; overflow-anchor: none; }
.pane-f { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; flex: none; }
.jump { position: sticky; bottom: 10px; margin: 0 auto 8px; z-index: 6; height: 26px; padding: 0 10px; border-radius: 99px; border: 0; background: var(--primary); color: var(--primary-fg); font-size: 12px; cursor: pointer; box-shadow: var(--shadow-pop); display: flex; align-items: center; gap: 4px; width: max-content; }
.collapsed-pane { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; }
.vtext { writing-mode: vertical-rl; font-size: 13px; letter-spacing: 2px; color: var(--muted-fg); }

/* consultation */
.consult-sub { font-size: 11px; color: var(--muted-fg); }
.paused-bar { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 12.5px; color: var(--warning); background: color-mix(in srgb, var(--warning) 9%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--warning) 25%, transparent); flex: none; }
.transcript { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 16px; }
.turn { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; position: relative; }
.turn .who { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.turn.doctor .who { background: var(--accent); color: var(--accent-fg); }
.turn.patient .who { background: var(--secondary); }
.turn .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-fg); flex-wrap: wrap; min-height: 18px; }
.turn .meta b { color: var(--foreground); font-weight: 500; }
.turn .text { font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
.turn .text.rough { color: var(--muted-fg); font-style: italic; }
.turn.failed .text { color: var(--destructive); font-size: 13px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted-fg); padding: 0 5px; height: 18px; border-radius: 4px; background: var(--muted); }
.tag.playing { color: var(--info); background: color-mix(in srgb, var(--info) 10%, transparent); }
.tag.warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent); }
.eq { display: inline-flex; gap: 1.5px; align-items: flex-end; height: 10px; }
.eq i { width: 2px; background: currentColor; border-radius: 1px; animation: eq .9s ease-in-out infinite; height: 40%; }
.eq i:nth-child(2) { animation-delay: .2s } .eq i:nth-child(3) { animation-delay: .4s }
@keyframes eq { 50% { height: 100%; } }
.tts-bar { height: 2px; border-radius: 2px; background: var(--muted); margin-top: 4px; overflow: hidden; }
.tts-bar span { display: block; height: 100%; background: var(--info); }

function applyOne(s, f) {
  const now = Date.now();
  const ti = s.chat.findLastIndex(c => c.status === 'running');
  if (ti < 0) return s;
  s = { ...s, note: { ...s.note }, halo: { ...s.halo }, sugs: [...s.sugs], inv: [...s.inv], dxDraft: [...s.dxDraft], rxDraft: [...s.rxDraft], chat: [...s.chat] };
  const turn = { ...s.chat[ti], steps: s.chat[ti].steps.map(x => (x.kind === 'think' && x.state === 'running') ? { ...x, state: 'done', dur: Math.max(0.4, (now - s.chat[ti].t) / 1000) } : x), cnt: { ...s.chat[ti].cnt }, says: [...s.chat[ti].says] };
  const nid = () => ++s.id;
  const inc = k => { turn.cnt[k] = (turn.cnt[k] || 0) + 1; };
  const tool = (name, subject, args, result, state = 'ok', meta = '') => turn.steps.push({ kind: 'tool', name, subject, args, result, state, meta, t: now, dur: +(0.18 + Math.random() * 0.32).toFixed(2) });
  const sug = (m, label, apply, k, detail, target) => {
    s.sugs.push({ id: nid(), m, k, label, apply, detail, turnId: turn.id }); s.halo[m] = now; inc('conflict');
    tool('ui_act', label, { action: 'fill', target }, '{"applied":false,"reason":"doctor_edited_or_focused","suggestion":"pending"}', 'approval', '医生已编辑');
  };
  if (f.m === 'snapshot') {
    const edited = SECTIONS.filter(x => s.note[x.key].edited).map(x => 'note.' + x.key);
    tool('ui_snapshot', '工作区快照', { scope: 'workspace', include: ['drafts', 'focused', 'doctorEdited'] }, JSON.stringify({ focused: s.focused ? 'note.' + s.focused : null, doctorEdited: edited, pendingSuggestions: s.sugs.length }), 'ok', s.focused ? `焦点 note.${s.focused}` : `${edited.length} 个医生编辑字段`);
  } else if (f.m === 'note') {
    const cur = s.note[f.k];
    const next = f.append ? (cur.text ? cur.text + f.append : f.append) : f.text;
    if (cur.edited || s.focused === f.k) sug('note', `${SEC[f.k]}：${f.append ? '补充' : '改写'}`, { type: 'NOTE_SET', k: f.k, text: next, keepEdited: true }, f.k, f.append || f.text, 'note.' + f.k);
    else { s.note[f.k] = { text: next, edited: false }; s.halo.note = now; s.halo['note.' + f.k] = now; inc('note'); tool('ui_act', `填写「${SEC[f.k]}」`, { action: f.append ? 'append' : 'fill', target: 'note.' + f.k, text: f.append || f.text }, '{"ok":true}', 'ok', f.append ? '+1 句' : '改写'); }
  } else if (f.m === 'inv') {
    if (!s.inv.some(i => i.key === f.key && i.st !== 'cancelled')) {
      if (s.touched.inv) sug('inv', `检查草稿「${invOf(f.key).name}」`, { type: 'INV_ADD', key: f.key, by: 'copilot' }, null, `${invOf(f.key).specimen} · ${invOf(f.key).dept}`, 'investigations.draft');
      else { s.inv.push({ id: nid(), key: f.key, st: 'draft', by: 'copilot', reports: [], stages: [] }); s.halo.inv = now; inc('inv'); tool('ui_act', `检查草稿「${invOf(f.key).name}」`, { action: 'add_row', target: 'investigations.draft', catalogItem: f.key }, '{"ok":true,"status":"draft"}', 'ok', '+1 行'); }
    }
  } else if (f.m === 'dx') {
    if (!s.dxDraft.some(d => d.code === f.code) && !s.dxRevs.at(-1)?.items.some(d => d.code === f.code)) {
      if (s.touched.dx) sug('dx', `候选诊断「${icd(f.code).name}」`, { type: 'DX_ADD', code: f.code, primary: f.primary, by: 'copilot' }, null, `${f.code} · ${f.primary ? '建议为主诊断' : '次诊断'}`, 'diagnosis.draft');
      else { const primary = f.primary && !s.dxDraft.some(d => d.primary); s.dxDraft.push({ code: f.code, primary, by: 'copilot' }); s.halo.dx = now; inc('dx'); tool('ui_act', `候选诊断「${icd(f.code).name}」`, { action: 'add_row', target: 'diagnosis.draft', icd10: f.code, primary }, '{"ok":true,"status":"draft"}', 'ok', primary ? '主诊断' : '次诊断'); }
    }
  } else if (f.m === 'rx') {
    if (!s.rxDraft.some(r => r.key === f.key) && !s.rxIssued.some(r => r.key === f.key) && !s.noMed) {
      const dr = drug(f.key); const line = { key: f.key, dose: dr.dose, freq: dr.freq, days: dr.days, route: dr.route, by: 'copilot' };
      if (s.touched.rx) sug('rx', `处方草稿「${dr.name}」`, { type: 'RX_ADD', key: f.key, by: 'copilot' }, null, `${dr.dose} ${dr.doseUnit} ${dr.route} ${FREQ[dr.freq].t} × ${dr.days} 天`, 'prescription.draft');
      else { s.rxDraft.push(line); s.halo.rx = now; inc('rx'); tool('ui_act', `处方草稿「${dr.name}」`, { action: 'add_row', target: 'prescription.draft', drug: f.key, dose: `${dr.dose} ${dr.doseUnit}`, freq: dr.freq, days: dr.days }, `{"ok":true,"allergyCheck":"pass (${dr.cls} ≠ penicillin)"}`, 'ok', '+1 行'); }
    }
  } else if (f.m === 'read') {
    tool('read_released_reports', invOf(f.key).name, { investigation: f.key, version: 'latest' }, JSON.stringify({ version: f.v || 1, summary: f.text }), 'ok', `第 ${f.v || 1} 版`);
  } else if (f.m === 'blocked') {
    inc('blocked'); tool('ui_act', '点击「确认诊断」', { action: 'click', target: 'button[data-agent-confirm]「确认诊断」' }, '{"applied":false,"error":"DENIED: data-agent-confirm 控件只允许医生本人操作"}', 'denied', '已拦截');
  } else if (f.m === 'warn' || f.m === 'say') turn.says.push(f.text);
  s.chat[ti] = turn;
  return s;
}

function gates(s) {
  const lastDx = s.dxRevs.at(-1);
  const prim = lastDx ? lastDx.items.filter(i => i.primary).length : 0;
  const active = s.inv.filter(i => i.st === 'ordered' || i.st === 'released');
  const unacked = active.filter(i => !(i.st === 'released' && i.reports.at(-1).ack));
  const lastNote = s.noteRevs.at(-1);
  const stale = lastNote && lastDx && lastNote.seq < lastDx.seq;
  const pend = { inv: s.inv.filter(i => i.st === 'draft').length, dx: s.dxDraft.length, rx: s.rxDraft.length, sug: s.sugs.length };
  const pendN = pend.inv + pend.dx + pend.rx + pend.sug;
  return [
    { n: 1, name: '主诊断确认', ok: prim === 1, why: lastDx ? `第 ${s.dxRevs.length} 次确认` : '尚未确认诊断', tab: 'dx' },
    { n: 2, name: '必需报告查阅', ok: unacked.length === 0, why: active.length === 0 ? '无已开立检查' : unacked.length ? `${unacked.length} 项待出报告或待阅` : `${active.length} 项最新版本已阅`, tab: 'inv' },
    { n: 3, name: '用药结论记录', ok: s.rxIssued.length > 0 || s.noMed, why: s.noMed ? '已确认无需用药' : s.rxIssued.length ? `已开具 ${s.rxIssued.length} 种药` : '尚未开具处方或确认无需用药', tab: 'rx' },
    { n: 4, name: '门诊病历签署', ok: !!lastNote && !stale, why: !lastNote ? '尚未签署' : stale ? '签署早于诊断修改，需追加签署' : `第 ${s.noteRevs.length} 版已签署`, tab: 'note' },
    { n: 5, name: '待提交草稿处理', ok: pendN === 0, why: pendN === 0 ? '无遗留草稿' : [pend.inv && `检查 ${pend.inv}`, pend.dx && `诊断 ${pend.dx}`, pend.rx && `处方 ${pend.rx}`, pend.sug && `待确认建议 ${pend.sug}`].filter(Boolean).join(' · '), tab: pend.sug ? s.sugs[0].m : pend.inv ? 'inv' : pend.dx ? 'dx' : 'rx' },
  ];
}

const FREE = ['TICK', 'RESET', 'TOAST', 'TOAST_CLEAR', 'READ', 'CONN', 'AUTO', 'MODEL', 'FEEDBACK', 'VOICE_MODE', 'MIC', 'DEVICE', 'TTS', 'TTS_STOP', 'PTT', 'INTERIM', 'ASR', 'SAVED', 'COPILOT_START', 'COPILOT_STEP', 'COPILOT_FINISH', 'COPILOT_STOP', 'RUNQ', 'PENDING_EVENTS', 'DEBOUNCE', 'COMPACT', 'FOCUS'];
function reducer(s, a) {
  const now = Date.now();
  if (s.status !== 'active' && !FREE.includes(a.type)) return s;
  const toast = (kind, text, undo) => ({ ...s, toast: { kind, text, undo, t: now } });
  const saving = { state: 'saving', t: now };
  switch (a.type) {
    case 'TICK': return { ...s, now };
    case 'RESET': return init();
    case 'TOAST': return { ...s, toast: { ...a.toast, t: now } };
    case 'TOAST_CLEAR': return { ...s, toast: null };
    case 'READ': return s.unread ? { ...s, unread: 0 } : s;
    /* voice */
    case 'VOICE_MODE': return { ...s, voice: { ...s.voice, mode: a.mode, ptt: false, pttCancel: false, interim: null } };
    case 'MIC': return { ...s, voice: { ...s.voice, live: a.on ?? !s.voice.live, interim: null } };
    case 'DEVICE': return { ...s, voice: { ...s.voice, device: a.device } };
    case 'PTT': return { ...s, voice: { ...s.voice, ptt: a.on, pttAt: a.on && !s.voice.ptt ? now : s.voice.pttAt, pttCancel: !!a.cancel } };
    case 'INTERIM': return { ...s, voice: { ...s.voice, interim: a.text == null ? null : { text: a.text, final: !!a.final } } };
    case 'ASR': return { ...s, voice: { ...s.voice, asr: a.asr } };
    case 'TTS': return { ...s, tts: { on: !s.tts.on, playing: s.tts.on ? null : s.tts.playing } };
    case 'TTS_PLAY': return { ...s, tts: { ...s.tts, playing: { id: a.id, t0: now, dur: a.dur } }, turns: s.turns.map(t => t.id === a.id ? { ...t, interrupted: false } : t) };
    case 'TTS_STOP': {
      const p = s.tts.playing; if (!p || (a.id && p.id !== a.id)) return s;
      return { ...s, tts: { ...s.tts, playing: null }, turns: a.interrupted ? s.turns.map(t => t.id === p.id ? { ...t, interrupted: true } : t) : s.turns };
    }
    /* consultation */
    case 'SEND': return { ...s, pending: true, pendingSince: now, voice: { ...s.voice, interim: null, latency: a.latency ?? s.voice.latency },
      turns: [...s.turns, { id: a.did, sp: 'doctor', text: a.text, st: 'final', t: now, src: a.src, dur: a.dur, conf: a.conf }, { id: a.pid, sp: 'patient', text: '', st: 'pending', q: a.text, t: now }] };
    case 'REPLY': return { ...s, turns: s.turns.map(t => t.id === a.pid ? { ...t, text: a.text, st: 'streaming', t: now } : t) };
    case 'FINAL': return { ...s, pending: false, pendingSince: null, turns: s.turns.map(t => t.id === a.pid ? { ...t, st: 'final' } : t) };
    case 'FAIL': return { ...s, pending: false, pendingSince: null, turns: s.turns.map(t => t.id === a.pid ? { ...t, st: 'failed', text: '模拟患者 30 秒无应答，本轮已标记失败（锁已释放）' } : t) };
    case 'USE': return { ...s, used: { ...s.used, [a.i]: true } };
    case 'FAILNEXT': return { ...s, failNext: !s.failNext };
    case 'EXAM': { const e = EXAMS.find(x => x.key === a.key); return { ...s, exams: { ...s.exams, [a.key]: now }, turns: [...s.turns, { id: now, sp: 'exam', text: `${e.name}：${e.f}`, st: 'final', t: now }] }; }
    /* note */
    case 'FOCUS': return s.focused === a.k ? s : { ...s, focused: a.k };
    case 'NOTE_EDIT': return { ...s, note: { ...s.note, [a.k]: { text: a.text, edited: true } }, saved: saving };
    case 'NOTE_SET': return { ...s, note: { ...s.note, [a.k]: { text: a.text, edited: !!a.keepEdited } }, saved: saving };
    case 'NOTE_APPEND': {
      const cur = s.note[a.k]; const sep = cur.text && !/[。；\s]$/.test(cur.text) ? '；' : '';
      const next = { ...s, note: { ...s.note, [a.k]: { text: cur.text + sep + a.text, edited: true } }, saved: saving };
      return a.silent ? next : { ...next, toast: { kind: 'info', text: `已引用到「${SEC[a.k]}」`, undo: { type: 'NOTE_SET', k: a.k, text: cur.text, keepEdited: cur.edited }, t: now } };
    }
    case 'SAVED': return { ...s, saved: { state: 'saved', t: now } };
    case 'NOTE_SIGN': {
      if (!s.note.cc.text || !s.note.hpi.text) return toast('crit', '服务端拒绝：主诉、现病史为必填项');
      const seq = s.seq + 1; return { ...s, seq, noteRevs: [...s.noteRevs, { seq, t: now, by: DOCTOR.name, snap: Object.fromEntries(SECTIONS.map(x => [x.key, s.note[x.key].text])) }] };
    }
    /* investigations */
    case 'INV_ADD':
      if (s.inv.some(i => i.key === a.key && i.st !== 'cancelled')) return toast('info', `「${invOf(a.key).name}」已在列表中`);
      return { ...s, id: s.id + 1, touched: a.by === 'doctor' ? { ...s.touched, inv: true } : s.touched, inv: [...s.inv, { id: s.id + 1, key: a.key, st: 'draft', by: a.by, reports: [], stages: [] }] };
    case 'INV_DROP': return { ...s, touched: { ...s.touched, inv: true }, inv: s.inv.filter(i => !(i.id === a.id && i.st === 'draft')) };
    case 'INV_DROP_KEY': return { ...s, inv: s.inv.filter(i => !(i.key === a.key && i.st === 'draft')) };
    case 'INV_ISSUE': return { ...s, inv: s.inv.map(i => a.ids.includes(i.id) ? { ...i, st: 'ordered', orderedAt: now, stages: [{ name: '已开立', t: now }] } : i) };
    case 'INV_STAGE': return { ...s, inv: s.inv.map(i => i.id === a.id && i.st === 'ordered' && !i.stages.some(x => x.name === a.name) ? { ...i, stages: [...i.stages, { name: a.name, t: now }] } : i) };
    case 'INV_CANCEL': {
      const i = s.inv.find(x => x.id === a.id);
      if (i.reports.length) return toast('crit', '服务端拒绝：报告已发布的检查不能取消');
      return { ...s, inv: s.inv.map(x => x.id === a.id ? { ...x, st: 'cancelled', stages: [...x.stages, { name: '已取消', t: now }] } : x) };
    }
    case 'INV_RELEASE': return { ...s, inv: s.inv.map(i => {
      if (i.id !== a.id || i.st !== 'ordered') return i;
      const order = STAGES[invOf(i.key).cat];
      const filled = order.slice(0, -1).filter(n => !i.stages.some(x => x.name === n)).map(n => ({ name: n, t: now }));
      return { ...i, st: 'released', stages: [...i.stages, ...filled, { name: '已出报告', t: now }].sort((x, y) => order.indexOf(x.name) - order.indexOf(y.name)), reports: [mkReport(i.key, 1)] };
    }) };
    case 'INV_AMEND': return { ...s, inv: s.inv.map(i => i.id === a.id && i.st === 'released' ? { ...i, reports: [...i.reports, mkReport(i.key, i.reports.length + 1, true)] } : i) };
    case 'INV_ACK': return { ...s, inv: s.inv.map(i => a.ids.includes(i.id) ? { ...i, reports: i.reports.map((r, j) => j === i.reports.length - 1 ? { ...r, ack: true, ackAt: now, ackBy: DOCTOR.name } : r) } : i) };
    /* diagnosis */
    case 'DX_ADD': {
      if (s.dxDraft.some(d => d.code === a.code)) return toast('info', `「${icd(a.code).name}」已在草稿中`);
      if (s.dxDraft.length >= 8) return toast('crit', '诊断最多 8 项');
      const primary = !!a.primary && !s.dxDraft.some(d => d.primary);
      return { ...s, touched: a.by === 'doctor' ? { ...s.touched, dx: true } : s.touched, dxDraft: [...s.dxDraft, { code: a.code, primary, by: a.by }] };
    }
    case 'DX_PRIMARY': return { ...s, touched: { ...s.touched, dx: true }, dxDraft: s.dxDraft.map(d => ({ ...d, primary: d.code === a.code })) };
    case 'DX_DROP': return { ...s, touched: { ...s.touched, dx: true }, dxDraft: s.dxDraft.filter(d => d.code !== a.code) };
    case 'DX_CLEAR': return { ...s, dxDraft: [], touched: { ...s.touched, dx: true } };
    case 'DX_CONFIRM': {
      const p = s.dxDraft.filter(d => d.primary).length;
      if (p !== 1) return toast('crit', `服务端拒绝：每次确认须恰有一项主诊断（当前 ${p} 项）`);
      const seq = s.seq + 1;
      return { ...s, seq, dxRevs: [...s.dxRevs, { seq, t: now, by: DOCTOR.name, items: s.dxDraft.map(({ code, primary }) => ({ code, primary })) }], dxDraft: [], touched: { ...s.touched, dx: false } };
    }
    case 'DX_REVISE': return { ...s, dxDraft: s.dxRevs.at(-1).items.map(i => ({ ...i, by: 'doctor' })), touched: { ...s.touched, dx: true } };
    /* prescription */
    case 'RX_MODE': return { ...s, rxMode: a.mode };
    case 'RX_ADD': {
      if (s.rxDraft.some(r => r.key === a.key)) return toast('info', `「${drug(a.key).name}」已在草稿中`);
      const dr = drug(a.key);
      return { ...s, touched: a.by === 'doctor' ? { ...s.touched, rx: true } : s.touched, rxDraft: [...s.rxDraft, { key: a.key, dose: dr.dose, freq: dr.freq, days: dr.days, route: dr.route, by: a.by }], redline: null, warnline: null };
    }
    case 'RX_EDIT': return { ...s, touched: { ...s.touched, rx: true }, rxDraft: s.rxDraft.map(r => r.key === a.key ? { ...r, [a.field]: a.value, by: 'doctor' } : r) };
    case 'RX_DROP': return { ...s, touched: { ...s.touched, rx: true }, rxDraft: s.rxDraft.filter(r => r.key !== a.key), redline: null, warnline: null };
    case 'RX_ISSUE': {
      if (!s.dxRevs.length) return toast('crit', '服务端拒绝：须先确认诊断才能开具处方');
      if (s.noMed) return toast('crit', '服务端拒绝：已确认无需用药，与处方互斥');
      const ds = s.rxDraft.map(r => drug(r.key));
      const red = ds.filter(d => RED[d.cls]);
      if (red.length) return { ...s, warnline: null, redline: { items: red.map(d => `${d.name}（${d.clsName}）`), t: now } };
      const warn = ds.filter(d => WARN[d.cls]);
      if (warn.length && !a.override) return { ...s, warnline: { items: warn.map(d => `${d.name}（${d.clsName}）`) } };
      return { ...s, redline: null, warnline: null, rxIssued: [...s.rxIssued, ...s.rxDraft.map(r => ({ ...r, t: now, override: a.override && WARN[drug(r.key).cls] ? a.override : null }))], rxDraft: [], touched: { ...s.touched, rx: false } };
    }
    case 'NOMED':
      if (s.rxIssued.length) return toast('crit', '服务端拒绝：已有有效处方，不能同时确认无需用药');
      if (!s.dxRevs.length) return toast('crit', '服务端拒绝：须先确认诊断');
      return { ...s, noMed: true, rxDraft: [] };
    /* suggestions */
    case 'SUG_ACCEPT': {
      const g = s.sugs.find(x => x.id === a.id); if (!g) return s;
      const ap = g.apply;
      const undo = ap.type === 'NOTE_SET' ? { type: 'NOTE_SET', k: ap.k, text: s.note[ap.k].text, keepEdited: s.note[ap.k].edited }
        : ap.type === 'INV_ADD' ? { type: 'INV_DROP_KEY', key: ap.key } : ap.type === 'DX_ADD' ? { type: 'DX_DROP', code: ap.code } : { type: 'RX_DROP', key: ap.key };
      const s2 = reducer({ ...s, sugs: s.sugs.filter(x => x.id !== a.id) }, ap);
      return { ...s2, toast: { kind: 'info', text: `已采纳：${g.label}`, undo, t: now } };
    }
    case 'SUG_DISMISS': return { ...s, sugs: s.sugs.filter(x => x.id !== a.id) };
    /* copilot */
    case 'COPILOT_START': return { ...s, id: s.id + 1, copilot: 'busy', busyText: a.text || '正在分析', chat: [...s.chat, { id: s.id + 1, t: now, trigger: a.trigger, status: 'running', steps: [{ kind: 'think', text: a.think, state: 'running' }], cnt: {}, says: [] }] };
    case 'COPILOT_STEP': return applyOne(s, a.f);
    case 'COPILOT_FINISH': {
      const ti = s.chat.findLastIndex(c => c.status === 'running'); if (ti < 0) return { ...s, copilot: 'idle', busyText: '' };
      const c = s.chat[ti]; const cnt = c.cnt;
      const parts = [];
      if (cnt.note) parts.push(`更新了 ${cnt.note} 处病历草稿`);
      if (cnt.inv) parts.push(`起草 ${cnt.inv} 项检查`);
      if (cnt.dx) parts.push(`加入 ${cnt.dx} 项候选诊断`);
      if (cnt.rx) parts.push(`起草 ${cnt.rx} 条处方`);
      let lead = parts.length ? parts.join('，') + '。' : '';
      if (cnt.conflict) lead += `有 ${cnt.conflict} 处涉及你改过的内容，我**没有覆盖**，放在下面等你确认。`;
      if (cnt.blocked) lead += '「确认诊断」是正式操作，需要你本人点击。';
      const reply = [lead, ...c.says].filter(Boolean).join('\n') || '没有需要更新的内容。';
      const chat = [...s.chat];
      chat[ti] = { ...c, status: 'done', dur: (now - c.t) / 1000, finishAt: now, reply, steps: c.steps.map(x => x.kind === 'think' && x.state === 'running' ? { ...x, state: 'done', dur: Math.max(0.4, (now - c.t) / 1000) } : x) };
      const s2 = { ...s, chat, copilot: 'idle', busyText: '', checkpoint: s.checkpoint + 1, unread: s.unread + 1 };
      chat[ti].usage = { in: ctxTotal(s2), out: 90 + tk(reply) + c.steps.length * 38 };
      return { ...s2, ctxReq: [...s.ctxReq, { t: now, label: c.trigger.text, parts: ctxParts(s2) }].slice(-30) };
    }
    case 'COPILOT_STOP': return { ...s, copilot: 'idle', busyText: '', chat: s.chat.map(c => {
      if (c.status !== 'running') return c;
      const done = c.steps.filter(x => x.kind === 'tool' && x.state === 'ok' && x.name === 'ui_act').length;
      return { ...c, status: 'stopped', dur: (now - c.t) / 1000, finishAt: now, reply: done ? `已停止。已完成的 ${done} 个草稿操作保留，可在对应页签删除或撤回。` : '已停止，本轮没有写入任何草稿。', steps: c.steps.map(x => x.kind === 'think' && x.state === 'running' ? { ...x, state: 'stopped' } : x) };
    }) };
    case 'RUNQ': return { ...s, runQ: a.items };
    case 'PENDING_EVENTS': return { ...s, pendingEvents: a.items };
    case 'DEBOUNCE': return { ...s, debounce: a.v };
    case 'AUTO': return { ...s, auto: !s.auto };
    case 'CONN': return { ...s, conn: a.v };
    case 'MODEL': return { ...s, model: { ...s.model, ...a.v } };
    case 'FEEDBACK': return { ...s, chat: s.chat.map(c => c.id === a.id ? { ...c, fb: c.fb === a.v ? null : a.v } : c) };
    case 'COMPACT': {
      if (s.copilot === 'busy') return toast('info', '助手运行中，结束后再压缩');
      const before = ctxTotal(s); const s2 = { ...s, compactedAt: s.chat.length }; const after = ctxTotal(s2);
      const id = s.id + 1;
      return { ...s2, id, chat: [...s.chat, { id, kind: 'compact', t: now, before, after, status: 'done', trigger: { kind: 'system', text: '上下文压缩' }, steps: [], reply: '' }], ctxReq: [...s.ctxReq, { t: now, label: '上下文压缩', cmp: true, parts: ctxParts(s2) }], toast: { kind: 'info', text: `上下文已压缩：${fmtK(before)} → ${fmtK(after)}`, t: now } };
    }
    case 'COMPLETE': {
      const bad = gates(s).filter(g => !g.ok);
      if (bad.length) return toast('crit', `服务端重验未通过：${bad.map(g => g.name).join('、')}，完诊被拒绝`);
      return { ...s, status: 'completed', completedAt: now };
    }
    case 'ABANDON': return { ...s, status: 'abandoned' };
    default: return s;
  }
}

/* ================= runtime (timers stand in for Durable Objects / Bailian voice) ================= */
const Ctx = createContext(null);
const useC = () => useContext(Ctx);
const agentState = (s, key) => { const t = s.halo[key]; if (!t) return 'idle'; const d = s.now - t; return d < 0 ? 'idle' : d < 1800 ? 'active' : d < 6000 ? 'recent' : 'idle'; };

function answerFor(q, s) {
  const rep = s.inv.filter(i => i.st === 'released').find(i => q.includes('@' + invOf(i.key).name));
  if (rep) {
    const r = rep.reports.at(-1);
    const extra = { cxr: '- 右下肺实变，与右下肺湿啰音、铁锈色痰相符\n- 支持**社区获得性肺炎（右下叶）**', cbc: '- 白细胞、中性粒细胞升高，淋巴细胞比例下降\n- 提示**细菌感染**', crp: '- CRP 明显升高，支持细菌性感染', pct: '- PCT 升高，支持细菌感染，可作为抗菌药物使用依据' }[rep.key] || '- 结合临床综合判断';
    return { think: `医生引用了「${invOf(rep.key).name}」第 ${r.v} 版报告，解读并结合临床。`, text: `**${invOf(rep.key).name}**（第 ${r.v} 版${r.ack ? '，已阅' : '，尚未确认已阅'}）：${reportShort(rep.key, r)}。\n${extra}` };
  }
  if (/鉴别/.test(q)) return { think: '基于发热、咳铁锈色痰、右侧胸痛和右下肺湿啰音，做下呼吸道感染的鉴别。', text: '鉴别诊断：\n1. **社区获得性肺炎**（细菌性，最可能）：铁锈色痰、寒战高热、右下肺湿啰音\n2. 急性支气管炎：通常无局灶体征与实变，需胸片排除\n3. 肺结核：亚急性病程、盗汗消瘦更常见，本例不支持\n4. 肺栓塞：胸痛气促需警惕，但发热咳脓痰不典型' };
  if (/检查/.test(q)) return { think: '检查要回答两件事：是否肺炎、严重度如何。', text: '建议：\n- **血常规、CRP**：感染证据\n- **胸部正侧位 X 线**：确认实变\n- PCT 可选，用于判断细菌感染\n- 若 SpO₂ 继续下降再考虑血气分析' };
  if (/药|抗生素|处方|抗菌|核查/.test(q)) {
    const pen = s.rxDraft.filter(r => RED[drug(r.key).cls]).map(r => drug(r.key).name);
    return { think: '对照过敏史核对处方草稿：青霉素过敏性休克 → 青霉素类禁用，头孢菌素慎用。', text: (pen.length ? `注意：草稿中的 **${pen.join('、')}** 属青霉素类，开具时会被红线拦截。\n` : '处方草稿未见青霉素类。\n') + '- 经验治疗推荐呼吸喹诺酮（`莫西沙星`）或 `多西环素`\n- 头孢菌素类有交叉过敏风险，需登记理由\n- 与氨氯地平无明显相互作用' };
  }
  if (/CURB|评分|住院|严重/.test(q)) return { think: '逐项计算 CURB-65。', text: '**CURB-65 = 0 分**\n- 意识：清 → 0\n- 尿素：未测\n- 呼吸 22 次/分 → 0\n- 血压 138/84 → 0\n- 年龄 58 → 0\n可门诊治疗；SpO₂ 94% 需 72 小时内复评。' };
  if (/小结/.test(q)) return { think: '汇总当前正式与草稿状态。', text: `**就诊小结**\n- 主诉：${s.note.cc.text || '—'}\n- 已问诊 ${s.turns.filter(t => t.sp === 'doctor').length} 轮，查体 ${Object.keys(s.exams).length} 项\n- 检查 ${s.inv.length} 项（${s.inv.filter(i => i.st === 'released').length} 项已出报告）\n- 诊断${s.dxRevs.length ? '已确认' : '未确认'}，处方${s.rxIssued.length ? '已开具' : '未开具'}` };
  return { think: '回答医生的问题，并给出当下最该做的事。', text: '我在持续看问诊和报告。目前建议：\n- 补问吸烟史\n- 完成肺部查体\n- 胸片出来后再定抗感染方案' };
}

function useRuntime() {
  const [s, d] = useReducer(reducer, null, init);
  const ref = useRef(s); ref.current = s;
  const [confirm, setConfirm] = useState(null);
  const R = useRef({ q: [], busy: false, timers: [], pending: [], deb: null, asr: [], ttsT: null, ptt: null });
  useEffect(() => { const i = setInterval(() => d({ type: 'TICK' }), 250); return () => clearInterval(i); }, []);
  useEffect(() => { if (!s.toast) return; const t = setTimeout(() => d({ type: 'TOAST_CLEAR' }), s.toast.undo ? 6000 : 3800); return () => clearTimeout(t); }, [s.toast]);
  useEffect(() => { if (s.saved.state !== 'saving') return; const t = setTimeout(() => d({ type: 'SAVED' }), 700); return () => clearTimeout(t); }, [s.note, s.saved.state]);
  const api = useMemo(() => {
    const later = (ms, fn) => setTimeout(fn, ms);
    const toast = (kind, text) => d({ type: 'TOAST', toast: { kind, text } });
    const ask = (title, lines, onOk, danger, okLabel) => setConfirm({ title, lines, onOk, danger, okLabel });
    const syncQ = () => d({ type: 'RUNQ', items: R.current.q.map(j => j.trigger) });
    const pump = () => {
      const Q = R.current;
      if (Q.busy || !Q.q.length || ref.current.conn !== 'connected') { syncQ(); return; }
      const job = Q.q.shift(); Q.busy = true; syncQ();
      const think = resolve(job.think); const fx = resolve(job.fx);
      d({ type: 'COPILOT_START', trigger: job.trigger, think, text: job.busy });
      const sched = (ms, fn) => Q.timers.push(setTimeout(fn, ms));
      let t = Math.min(2600, 500 + think.length * 16);
      fx.forEach(f => { sched(t, () => d({ type: 'COPILOT_STEP', f })); t += (f.m === 'say' || f.m === 'warn') ? 80 : 380 + Math.random() * 200; });
      sched(t + 220, () => { d({ type: 'COPILOT_FINISH' }); Q.busy = false; Q.timers = []; pump(); });
    };
    const enqueue = (job, front) => { front ? R.current.q.unshift(job) : R.current.q.push(job); pump(); };
    const trigger = (job, debounce) => {
      if (ref.current.status !== 'active') return;
      if (!ref.current.auto) { R.current.pending.push(job); d({ type: 'PENDING_EVENTS', items: R.current.pending.map(j => j.trigger) }); return; }
      if (debounce) {
        if (R.current.deb) { clearTimeout(R.current.deb.t); enqueue(R.current.deb.job); }
        const tm = later(1200, () => { R.current.deb = null; d({ type: 'DEBOUNCE', v: null }); enqueue(job); });
        R.current.deb = { t: tm, job }; d({ type: 'DEBOUNCE', v: { label: job.trigger.text, until: Date.now() + 1200 } }); return;
      }
      enqueue(job);
    };
    const flushDebounce = run => { const D = R.current.deb; if (!D) return; clearTimeout(D.t); R.current.deb = null; d({ type: 'DEBOUNCE', v: null }); if (run) enqueue(D.job); };
    const runPending = () => {
      const P = R.current.pending; R.current.pending = []; d({ type: 'PENDING_EVENTS', items: [] }); if (!P.length) return;
      enqueue(P.length === 1 ? P[0] : { trigger: { kind: 'event', text: `批量分析 ${P.length} 个事件` }, think: () => P.map(j => resolve(j.think)).join('\n'), fx: () => [{ m: 'snapshot' }, ...P.flatMap(j => resolve(j.fx).filter(f => f.m !== 'snapshot'))], busy: '正在批量分析' });
    };
    /* patient + TTS */
    const playTTS = (id, text) => {
      const dur = text.length * 0.21 + 0.6;
      d({ type: 'TTS_PLAY', id, dur }); clearTimeout(R.current.ttsT);
      R.current.ttsT = later(dur * 1000, () => d({ type: 'TTS_STOP', id }));
    };
    const send = (text, src = 'text', dur) => {
      const st = ref.current; text = (text || '').trim(); if (!text || st.status !== 'active') return false;
      if (st.pending) { toast('crit', '上一问尚未得到患者回答，暂不能提交新问题'); return false; }
      if (st.tts.playing) d({ type: 'TTS_STOP', interrupted: true });
      const did = Date.now(), pid = did + 1;
      d({ type: 'SEND', text, did, pid, src, dur, conf: src === 'voice' ? +(0.9 + Math.random() * 0.08).toFixed(2) : undefined, latency: src === 'voice' ? Math.round(220 + Math.random() * 200) : undefined });
      if (st.failNext) { d({ type: 'FAILNEXT' }); later(2600, () => d({ type: 'FAIL', pid })); return true; }
      const idx = matchScript(text); const reply = idx >= 0 ? SCRIPT[idx].reply : FALLBACK;
      later(700 + Math.random() * 500, () => {
        d({ type: 'REPLY', pid, text: reply });
        if (ref.current.tts.on) playTTS(pid, reply);
        later(reply.length * 38 + 120, () => {
          d({ type: 'FINAL', pid });
          if (idx >= 0 && !ref.current.used[idx]) {
            d({ type: 'USE', i: idx });
            const n = ref.current.turns.filter(t => t.sp === 'doctor').length;
            trigger({ fx: [{ m: 'snapshot' }, ...SCRIPT[idx].fx], trigger: { kind: 'event', text: `问诊第 ${n} 轮已定稿` }, think: THINKS[idx], busy: '正在整理本轮问诊' }, true);
          }
        });
      });
      return true;
    };
    /* ASR simulation */
    const clearAsr = () => { R.current.asr.forEach(clearTimeout); R.current.asr = []; };
    const streamInterim = (rough, cps, onDone) => {
      clearAsr(); let n = 0;
      const step = () => { n = Math.min(rough.length, n + 2); d({ type: 'INTERIM', text: rough.slice(0, n) }); if (n < rough.length) R.current.asr.push(later(2000 / cps, step)); else if (onDone) onDone(); };
      step();
    };
    const voiceBlocked = () => {
      const st = ref.current;
      if (st.status !== 'active') return true;
      if (st.pending) { toast('info', '等待患者回答后再提问'); return true; }
      if (st.voice.asr !== 'connected') { toast('info', '语音识别重连中，请稍候或直接键入'); return true; }
      return false;
    };
    const nextQuestion = () => QUESTIONS.find(q => { const i = matchScript(q.text); return i >= 0 && !ref.current.used[i]; }) || EXTRA_Q;
    const speak = q => {
      const st = ref.current;
      if (R.current.asr.length || R.current.ptt || voiceBlocked()) return;

function PttButton() {
  const { s, api } = useC();
  const on = s.voice.ptt, cancel = s.voice.pttCancel;
  const held = on ? (s.now - s.voice.pttAt) / 1000 : 0;
  const down = useRef(false);
  const outside = (e, el) => { const r = el.getBoundingClientRect(); return e.clientY < r.top - 36 || e.clientX < r.left - 24 || e.clientX > r.right + 24; };
  return html`<button className=${'pttbtn' + (on ? ' on' : '') + (cancel ? ' cancel' : '')} disabled=${s.pending || s.status !== 'active'} aria-label="按住说话" aria-pressed=${on}
    onPointerDown=${e => { if (e.button !== 0) return; e.preventDefault(); e.currentTarget.setPointerCapture?.(e.pointerId); down.current = true; api.pttDown(); }}
    onPointerMove=${e => { if (down.current) api.pttCancel(outside(e, e.currentTarget)); }}
    onPointerUp=${e => { if (!down.current) return; down.current = false; api.pttUp(outside(e, e.currentTarget)); }}
    onPointerCancel=${() => { if (down.current) { down.current = false; api.pttUp(true); } }}
    onContextMenu=${e => e.preventDefault()}>
    <span className=${'rec-dot' + (on && !cancel ? ' on' : '')}></span>
    ${on ? html`<b>${cancel ? '松开取消' : '松开发送'}</b><span className="mono xs">${held.toFixed(1)}s</span><span className="xs mf">${cancel ? '' : '上移取消'}</span><${Level} on=${!cancel} speaking=${!!s.voice.interim} />`

}

  const unacked = s.inv.filter(i => i.st === 'released' && !i.reports.at(-1).ack).length;
  const sg = m => s.sugs.filter(g => g.m === m).length;
  const noteAgent = SECTIONS.filter(x => s.note[x.key].text && !s.note[x.key].edited).length;
  return {
    note: { pend: s.noteRevs.length ? 0 : 1, ai: sg('note') + noteAgent },
    inv: { pend: s.inv.filter(i => i.st === 'draft').length + unacked, ai: s.inv.filter(i => i.st === 'draft' && i.by === 'copilot').length + sg('inv') },
    dx: { pend: s.dxDraft.length, ai: s.dxDraft.filter(x => x.by === 'copilot').length + sg('dx') },
    rx: { pend: s.rxDraft.length, ai: s.rxDraft.filter(x => x.by === 'copilot').length + sg('rx') },
  };
}
function WorkspaceTabs({ tab, setTab }) {
  const { s } = useC();

  return html`<nav className="tabs" role="tablist" aria-label="病例页签">
    ${TABS.map((t, i) => html`<button key=${t.k} role="tab" aria-selected=${tab === t.k} className=${'tab' + (tab === t.k ? ' on' : '')} onClick=${() => setTab(t.k)} title=${`Alt+${i + 1}`} data-agent=${tab === t.k ? 'idle' : agentState(s, t.k)}>
      <${Icon} n=${t.ic} size=${15} />${t.name}${done[t.k] && html`<span className="st-ok" aria-label="已满足"><${Icon} n="Check" size=${11} /></span>`}
      ${b[t.k].pend > 0 && html`<span className="badge warn tiny" aria-label=${'待处理 ' + b[t.k].pend}>${b[t.k].pend}</span>`}
      ${b[t.k].ai > 0 && html`<span className="badge info tiny" aria-label=${'助手 ' + b[t.k].ai}>助手 ${b[t.k].ai}</span>`}
    </button>`)}
  </nav>`;
}

function Composer({ v, setV, setTab, inputRef }) {
  const { s, api } = useC();
  const [mode, setMode] = useState('steer'); const [hi, setHi] = useState(0);
  const busy = s.copilot === 'busy';
  const total = ctxTotal(s), pct = Math.round(total / CTX_WINDOW * 1000) / 10;
  const tok = v.match(/(?:^|\s)([\/@])([^\s]*)$/);
  const kind = tok ? (tok[1] === '/' && v.trimStart().startsWith('/') && !v.trim().includes(' ') ? 'slash' : tok[1] === '@' ? 'mention' : null) : null;
  const q = tok ? tok[2] : '';
  const items = kind === 'slash' ? SLASH.filter(c => c.cmd.slice(1).startsWith(q)) : kind === 'mention' ? mentionables(s).filter(m => m.label.includes(q)) : [];
  const submit = text => {
    text = (text ?? v).trim(); if (!text) return;
    if (text === '/上下文') { setTab('ctx'); setV(''); return; }
    api.askCopilot(text, busy && mode === 'steer'); setV('');
  };
  const pick = it => { if (kind === 'slash') submit(it.cmd); else setV(v.replace(/@[^\s]*$/, '@' + it.label + ' ')); setHi(0); inputRef.current?.focus(); };
  const onKey = e => {
    if (items.length && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); setHi(h => (h + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length); return; }
    if (items.length && (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey))) { e.preventDefault(); pick(items[hi % items.length]); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); submit(); }
    if (e.key === 'Escape' && busy) api.stop();
  };
  useLayoutEffect(() => { const el = inputRef.current; if (!el) return; el.style.height = 'auto'; el.style.height = Math.min(160, el.scrollHeight) + 'px'; }, [v]);
  return html`<div className="composer">
    ${s.runQ.length > 0 && html`<div className="queued" aria-label="排队中">${s.runQ.map((t, i) => html`<div key=${i} className="xs row nowrap"><span className="badge outline tiny">${t.kind === 'doctor' ? '排队' : '事件'}</span><span className="grow ellip">${t.text}</span></div>`)}</div>`}
    ${items.length > 0 && html`<div className="cmdmenu" role="listbox" aria-label=${kind === 'slash' ? '命令' : '引用 HIS 对象'}>${kind === 'mention' && html`<div className="menu-h">引用 HIS 对象（助手只读）</div>`}${items.map((it, i) => html`<button key=${it.cmd || it.label} role="option" aria-selected=${i === hi % items.length} className=${i === hi % items.length ? 'on' : ''} onMouseDown=${e => { e.preventDefault(); pick(it); }}>${kind === 'slash' ? html`<b className="mono xs">${it.cmd}</b><span className="mf xs">${it.desc}</span>` : html`<${Icon} n=${it.ic} size=${13} /><span>${it.label}</span><span className="mf xxs" style=${{ marginLeft: 'auto' }}>${it.kind}</span>`}</button>`)}</div>`}
    <div className="box">
      <textarea id="copilot-input" ref=${inputRef} rows="2" value=${v} onInput=${e => { setV(e.target.value); setHi(0); }} onKeyDown=${onKey} placeholder=${busy ? '助手运行中：可以插话或排队…' : '问临床助手…'} aria-label="向临床助手提问"></textarea>
      <div className="row nowrap" style=${{ gap: '4px' }}>
        <button className="ibtn" title="引用 HIS 对象（@）" aria-label="引用 HIS 对象" onClick=${() => { setV(v + (v && !v.endsWith(' ') ? ' @' : '@')); inputRef.current?.focus(); }}><${Icon} n="AtSign" size=${15} /></button>
        <button className="ibtn" title="命令（/）" aria-label="命令" onClick=${() => { setV('/'); inputRef.current?.focus(); }}><span className="mono" style=${{ fontSize: '14px' }}>/</span></button>
        <${Pop} placement="top-start" trigger=${(o, set) => html`<button className="chipm" style=${{ maxWidth: busy ? '96px' : '170px', overflow: 'hidden' }} onClick=${() => set(!o)} aria-label="选择模型" title=${s.model.name + ' · 思考 ' + EFFORT[s.model.effort]}><span className="mono ellip">${s.model.name}</span> · ${EFFORT[s.model.effort]}<${Icon} n="ChevronDown" size=${12} /></button>`}>${() => html`<${ModelMenu} />`}<//>
        <button className="chipm" onClick=${() => setTab('ctx')} title=${`${total} / ${CTX_WINDOW} tokens in context`} aria-label="查看上下文"><${Ring} pct=${pct} size=${12} />${pct}%</button>
        <span className="grow"></span>
        ${busy && html`<${Seg} size="xs" value=${mode} onChange=${setMode} options=${[['steer', '插话'], ['queue', '排队']]} label="运行中发送方式" /><button className="stopbtn" onClick=${api.stop} title="停止（Esc）" aria-label="停止"><${Icon} n="Square" size=${11} /></button>`}

      </div>

  </div>`;

    <table className="tbl"><tbody>${parts.map(c => { const p = prev?.find(x => x.k === c.k)?.tok ?? c.tok; const dlt = c.tok - p; return html`<tr key=${c.k}>
      <td><span className="row nowrap" style=${{ gap: 0 }}><span className="sw" style=${{ background: c.color }}></span>${c.name}</span></td><td className="num" style=${{ textAlign: 'right' }}>${fmtK(c.tok)}</td><td className="num mf" style=${{ textAlign: 'right' }}>${(c.tok / total * 100).toFixed(0)}%</td>
      <td style=${{ textAlign: 'right' }}>${dlt > 0 ? html`<span className="badge info tiny num">+${fmtK(dlt)}</span>` : dlt < 0 ? html`<span className="badge ok tiny num">${fmtK(dlt)}</span>` : ''}</td></tr>`; })}</tbody></table>
    <div className="iso"><${Icon} n="ShieldCheck" size=${15} style=${{ color: 'var(--success)', marginTop: '1px' }} /><span><b>Case Truth · 0 tokens · 已隔离</b><span className="mf"> — 隐藏诊断与未开立检查的结果不在上下文中，也没有能读取它们的工具（ADR-0002）。</span></span></div>

      <div className="xxs mf row between nowrap"><span>#1</span><span className="ellip">${s.ctxReq.length} 次请求 · 最近：${s.ctxReq.at(-1)?.label}</span></div></div>
    <div><h4 className="xs mf" style=${{ margin: '4px 0 6px', fontWeight: 500 }}>上下文浏览</h4>

        <ul>${c.items.map((it, i) => html`<li key=${i}><span className=${it[1] === 0 ? 'mf' : ''}>${it[0]}</span><span className="num mf">${it[1]}</span></li>`)}</ul></details>`)}
    </div>
    <div className="xxs mf">估算：1 token ≈ 0.74 个汉字。每轮回复下方的 ↑↓ 为提供商回报值。</div>

}

/* ================= layout ================= */
function Splitter({ value, set, min, max, dir, reset, label, cls = '' }) {
  const [drag, setDrag] = useState(false);
  const start = useRef(null);
  const clamp = v => Math.round(Math.max(min, Math.min(max, v)));
  const end = () => { start.current = null; setDrag(false); document.body.classList.remove('resizing'); };
  return html`<div className=${'splitter ' + cls + (drag ? ' drag' : '')} role="separator" aria-orientation="vertical" aria-label=${label} aria-valuenow=${value} aria-valuemin=${min} aria-valuemax=${max} tabIndex="0" title=${label + '（拖动调整，双击复位，方向键微调）'}
    onPointerDown=${e => { if (e.button !== 0) return; e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); start.current = { x: e.clientX, v: value, sc: getScale() }; setDrag(true); document.body.classList.add('resizing'); }}
    onPointerMove=${e => { const S = start.current; if (S) set(clamp(S.v + dir * (e.clientX - S.x) / S.sc)); }}
    onPointerUp=${end} onPointerCancel=${end} onDoubleClick=${() => set(reset)}
    onKeyDown=${e => { if (e.key === 'ArrowLeft') { e.preventDefault(); set(clamp(value - dir * 16)); } else if (e.key === 'ArrowRight') { e.preventDefault(); set(clamp(value + dir * 16)); } else if (e.key === 'Home') { e.preventDefault(); set(dir > 0 ? min : max); } else if (e.key === 'End') { e.preventDefault(); set(dir > 0 ? max : min); } }}>
    <span className="grip"><${Icon} n="GripVertical" size=${10} /></span>
    ${drag && html`<span className="size-tip">${value}px</span>`}
  </div>`;
}
function Workbench() {
  const { s, d, api } = useC();
  const [tab, setTab] = useState('note');
  const [ai, setAi] = usePersist('cm.ai', true);
  const [wc, setWc] = usePersist('cm.wc', 340);
  const [wa, setWa] = usePersist('cm.wa', 420);
  const [cc, setCc] = usePersist('cm.cc', false);
  const inputRef = useRef(null);
  useEffect(() => {
    const field = el => el && el.closest && el.closest('input, textarea, select, [contenteditable="true"]');
    const down = e => {
      const st = api.get();
      if (e.code === 'Space' && st.voice.mode === 'ptt' && !field(e.target) && !e.target.closest?.('.floating')) { e.preventDefault(); if (!e.repeat) api.pttDown(); return; }
      if ((e.key === 'm' || e.key === 'M') && !field(e.target) && !e.ctrlKey && !e.metaKey && !e.altKey && st.voice.mode === 'continuous') { api.toggleMic(); return; }
      if (e.altKey && /^[1-4]$/.test(e.key)) { e.preventDefault(); setTab(TABS[+e.key - 1].k); return; }
      if ((e.ctrlKey || e.metaKey) && e.key === '/') { e.preventDefault(); setAi(true); setTimeout(() => inputRef.current?.focus(), 30); return; }
      if (e.key === 'Escape' && st.copilot === 'busy' && !field(e.target)) api.stop();
    };
    const up = e => { if (e.code === 'Space' && api.get().voice.mode === 'ptt' && !field(e.target)) { e.preventDefault(); api.pttUp(false); } };
    addEventListener('keydown', down); addEventListener('keyup', up);
    return () => { removeEventListener('keydown', down); removeEventListener('keyup', up); };
  }, []);
  const Tab = { note: NoteTab, inv: InvTab, dx: DxTab, rx: RxTab }[tab];
  const jump = k => setTab(['note', 'inv', 'dx', 'rx'].includes(k) ? k : 'note');
  return html`<div className="app">
    <${TopBar} ai=${ai} setAi=${setAi} />
    ${s.status === 'abandoned' && html`<div className="paused-bar" style=${{ justifyContent: 'center' }}>本次就诊已放弃：写入冻结，病例真值未解锁。<button className="btn xs" onClick=${() => d({ type: 'RESET' })}>开始新的就诊</button></div>`}
    <div className=${'wb' + (ai ? '' : ' noai')} style=${{ '--wc': (cc ? 48 : wc) + 'px', '--wa': wa + 'px' }}>
      <${QueueRail} />
      <${ConsultColumn} collapsed=${cc} setCollapsed=${setCc} />
      ${cc ? html`<div></div>` : html`<${Splitter} value=${wc} set=${setWc} min=${260} max=${560} dir=${1} reset=${340} label="调整问诊记录宽度" />`}
      <main className="card main" aria-label="病例工作区">
        <${PatientBanner} onJump=${jump} />
        <${WorkspaceTabs} tab=${tab} setTab=${setTab} />
        <div className="panel"><${Tab} /></div>
        <${ActionBar} onJump=${jump} />
      </main>
      ${ai && html`<${Splitter} cls="agent-split" value=${wa} set=${setWa} min=${340} max=${680} dir=${-1} reset=${420} label="调整临床助手宽度" />`}
      ${ai && html`<${AgentPanel} onClose=${() => setAi(false)} onJump=${jump} inputRef=${inputRef} />`}
    </div>
  </div>`;
}

/* ================= overlays + app ================= */
function ConfirmDialog({ c, close }) {
  useEffect(() => { if (!c) return; const k = e => { if (e.key === 'Escape') close(); }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, [c]);
  if (!c) return null;
  return html`<div className="scrim" onMouseDown=${close}><div className="dialog" role="alertdialog" aria-modal="true" aria-labelledby="cm-t" onMouseDown=${e => e.stopPropagation()}>
    <div className="xxs mf" style=${{ letterSpacing: '.04em' }}>CLINICAL CONFIRMATION · 医生本人确认</div>
    <h3 id="cm-t" style=${{ fontSize: '16px' }}>${c.title}</h3>
    <ul style=${{ margin: 0, paddingLeft: '18px', fontSize: '14px', display: 'flex', flexDirection: 'column', gap: '3px' }}>${c.lines.map((l, i) => html`<li key=${i}>${l}</li>`)}</ul>
    <p className="xs mf">此按钮带 <code className="mono">data-agent-confirm</code>，助手无法代为点击；确认后由服务端原子校验并记录 practitionerId（${DOCTOR.name}）。</p>
    <div className="row" style=${{ justifyContent: 'flex-end' }}><button className="btn sm" onClick=${close} autoFocus>返回</button>
      <button className="btn sm primary" style=${c.danger ? { background: 'var(--destructive)', borderColor: 'var(--destructive)', color: 'var(--card)' } : null} onClick=${() => { c.onOk(); close(); }}>${c.okLabel || '确认'}</button></div>
  </div></div>`;
}
function Debrief() {
  const { s, d } = useC();
  const last = s.dxRevs.at(-1);
  const rows = [
    ['主诊断', last ? last.items.filter(i => i.primary).map(i => `${i.code} ${icd(i.code).name}`).join('') : '—', 'J18.9 社区获得性肺炎（右下叶）'],
    ['次诊断', last ? last.items.filter(i => !i.primary).map(i => icd(i.code).name).join('、') || '—' : '—', '原发性高血压；青霉素过敏个人史'],
    ['关键检查', s.inv.filter(i => i.st === 'released').map(i => invOf(i.key).name).join('、') || '—', '血常规、CRP、胸部 X 线（PCT 可选）'],
    ['肺部查体', s.exams.lung ? '已查：右下肺湿啰音' : '未查', '右下肺呼吸音减低伴湿啰音'],
    ['用药结论', s.noMed ? '无需用药' : s.rxIssued.map(r => drug(r.key).name).join('、') || '—', '莫西沙星或多西环素；避开青霉素类'],
    ['过敏史问诊', s.used[4] ? '已问到' : '未在问诊中追问', '青霉素过敏性休克'],

  return html`<div className="scrim"><div className="dialog wide" role="dialog" aria-modal="true" aria-labelledby="db-t">
    <div className="row between"><h3 id="db-t" style=${{ fontSize: '18px' }}>病例复盘 · ${PATIENT.name}</h3><span className="badge ok">已完诊 · ${clock(s.completedAt)} · 用时 ${fmtDur(s.completedAt - s.startedAt)} · 只读</span></div>
    <p className="xs mf">逐项并排对照本次正式记录与 Golden Case 参考，不打分。</p>
    <div className="tblwrap"><table className="tbl"><thead><tr><th>项目</th><th>本次正式记录</th><th>Golden 参考</th></tr></thead>
      <tbody>${rows.map(r => html`<tr key=${r[0]}>${r.map((c, i) => html`<td key=${i} style=${i === 0 ? { fontWeight: 500 } : null}>${c}</td>`)}</tr>`)}</tbody></table></div>
    <div className="row" style=${{ justifyContent: 'flex-end' }}><button className="btn sm primary" onClick=${() => d({ type: 'RESET' })}>为同一病例开始新的就诊</button></div>
  </div></div>`;
}

      <div className="row" style=${{ gap: '6px' }}><button onClick=${() => d({ type: 'RESET' })}>重置病例</button><button onClick=${() => { ['cm.wc', 'cm.wa', 'cm.cc', 'cm.ai'].forEach(k => { try { localStorage.removeItem(k); } catch {} }); location.reload(); }}>重置布局</button></div>
      <div style=${{ color: '#aaa' }}>完诊 ${gates(s).map(g => (g.ok ? '●' : '○')).join(' ')} · 草稿 检查${s.inv.filter(i => i.st === 'draft').length}/诊断${s.dxDraft.length}/处方${s.rxDraft.length} · 待确认 ${s.sugs.length} · 上下文 ${fmtK(ctxTotal(s))}</div>
