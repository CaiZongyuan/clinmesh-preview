<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTS 音色库 · Sambert / MiniMax</title>
<style>
:root{
  --bg:#0a0a0b; --panel:#131316; --panel-hover:#17171b; --border:#232329; --border-hi:#3f3f46;
  --text:#ececee; --muted:#8f8f98; --dim:#5c5c64;
  --green:#34d399; --amber:#fbbf24; --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:#2e2e38}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26262c;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

header{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1160px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2dd4bf,#6366f1);display:grid;place-items:center;font-weight:700;font-size:13px;color:#0a0a0b}
.logo h1{font-size:15px;font-weight:600;letter-spacing:.2px}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--dim)}
.search input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px 8px 33px;color:var(--text);outline:none;font-size:13px;transition:border-color .15s}
.search input:focus{border-color:var(--border-hi)}
.search input::placeholder{color:var(--dim)}
.kbd{font-size:11px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:1px 6px}

.layout{max-width:1160px;margin:0 auto;padding:20px;display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:18px}
.provider{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.provider button{border:1px solid var(--border);border-radius:11px;padding:10px 8px;text-align:left;transition:.15s;background:var(--panel)}
.provider button .p-name{font-weight:600;font-size:13px}
.provider button .p-meta{font-size:11px;color:var(--muted);margin-top:2px}
.provider button.active{border-color:var(--border-hi);background:var(--panel-hover)}
.provider button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot-free{background:var(--green)} .dot-paid{background:var(--amber)}
.filter-group h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);transition:.12s;background:transparent}
.chip:hover{color:var(--text);border-color:var(--border-hi)}
.chip.on{background:#1e1e24;border-color:var(--border-hi);color:var(--text)}
.chip .n{color:var(--dim);font-size:11px;margin-left:4px}
.clear-btn{font-size:12px;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.clear-btn:hover{color:var(--muted)}

.list-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.list-head .title{font-size:13px;font-weight:600}
.list-head .count{font-size:12px;color:var(--muted)}
.voice-list{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel)}
.row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative}
.row:last-child{border-bottom:none}
.row:hover{background:var(--panel-hover)}
.row.selected{background:#191920}
.row.selected::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--green)}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;color:#0b0b0c}
.a-male{background:linear-gradient(135deg,#7dd3fc,#818cf8)}
.a-female{background:linear-gradient(135deg,#f9a8d4,#c4b5fd)}
.a-child{background:linear-gradient(135deg,#fde68a,#fca5a5)}
.a-other{background:linear-gradient(135deg,#a7f3d0,#93c5fd)}
.a-lang{background:linear-gradient(135deg,#d4d4d8,#71717a);font-size:17px}
.v-main{flex:1;min-width:0}
.v-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.v-id{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-num{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:1.6}
.v-tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:44%;flex:none}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 7px;white-space:nowrap}
.tag.green{color:var(--green);border-color:#14532d55}
.tag.amber{color:var(--amber);border-color:#713f1255}
.actions{display:flex;align-items:center;gap:8px;flex:none}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;transition:.15s;background:var(--bg)}
.play:hover{background:var(--text);border-color:var(--text)}
.play:hover svg{fill:#0a0a0b;stroke:#0a0a0b}
.play svg{width:13px;height:13px;fill:var(--text);stroke:none;transition:.15s}
.play.disabled{opacity:.35;cursor:not-allowed}
.play.disabled:hover{background:var(--bg);border-color:var(--border)}
.play.disabled:hover svg{fill:var(--text)}
.row.playing .play{background:var(--text);border-color:var(--text)}
.eq{display:none;align-items:flex-end;gap:2px;height:14px}
.row.playing .eq{display:flex}
.row.playing .eq i{width:3px;background:#0a0a0b;border-radius:1px;animation:eq 1s ease-in-out infinite}
.row.playing .eq i:nth-child(1){height:60%;animation-delay:-.3s}
.row.playing .eq i:nth-child(2){height:100%;animation-delay:-.15s}
.row.playing .eq i:nth-child(3){height:45%}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim);transition:.12s}
.icon-btn:hover{color:var(--text);background:#1e1e24}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}
.empty b{color:var(--text)}

.detail{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.8,.2,1);background:rgba(15,15,17,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border-hi)}
.detail.show{transform:translateY(0)}
.detail-inner{max-width:1160px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.d-close{color:var(--dim);font-size:18px;line-height:1;padding:4px 6px;border-radius:8px}
.d-close:hover{color:var(--text);background:#1e1e24}
.d-name{font-weight:600;white-space:nowrap}
.d-name small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
.d-cmd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.d-cmd code{flex:1;font-family:var(--mono);font-size:12px;color:#d8d8de;white-space:nowrap;overflow-x:auto;scrollbar-width:thin}
.d-copy{flex:none;border:1px solid var(--border-hi);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:500;transition:.15s}
.d-copy:hover{background:var(--text);color:#0a0a0b;border-color:var(--text)}
.d-note{font-size:11.5px;color:var(--muted);white-space:nowrap}
.d-note .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}

footer{max-width:1160px;margin:26px auto 110px;padding:0 20px;color:var(--dim);font-size:12px;line-height:1.8}
footer a{color:var(--muted)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:14px}
  aside{position:static;flex-direction:row;flex-wrap:wrap;gap:14px}
  .provider{min-width:220px}
  .filter-group{flex:1;min-width:150px}
  .v-tags{display:none}
  .header-inner{flex-wrap:wrap}
  .search{max-width:none;min-width:100%;order:3}
  .detail-inner{flex-wrap:wrap}
  .d-cmd{min-width:100%;order:4}
}
</style>
</head>

</footer>

const $=s=>document.querySelector(s);
SAMBERT.forEach(v=>v.sceneParts=(v.scene||'').split('、').map(s=>s.trim()).filter(Boolean));
const state={provider:'sambert',q:'',filters:{},selected:null,audio:null,playingBtn:null};

const FLAG={ 'English':'🇬🇧','Chinese (Mandarin)':'🇨🇳','Japanese':'🇯🇵','Cantonese':'🇭🇰','Korean':'🇰🇷','Spanish':'🇪🇸','Portuguese':'🇧🇷','French':'🇫🇷','Indonesian':'🇮🇩','German':'🇩🇪','Russian':'🇷🇺','Italian':'🇮🇹','Dutch':'🇳🇱','Vietnamese':'🇻🇳','Arabic':'🇸🇦','Turkish':'🇹🇷','Ukrainian':'🇺🇦','Thai':'🇹🇭','Polish':'🇵🇱','Romanian':'🇷🇴','Greek':'🇬🇷','Czech':'🇨🇿','Finnish':'🇫🇮','Hindi':'🇮🇳' };

function genderOf(v){const f=(v.feature||'');if(/男/.test(f))return'男声';if(/女|姐/.test(f))return'女声';if(/童/.test(f))return'童声';return'其他';}
function avatarClass(g){return g==='男声'?'a-male':g==='女声'?'a-female':g==='童声'?'a-child':'a-other';}

function dataFor(){return state.provider==='sambert'?SAMBERT:MINIMAX;}
function keyFor(v){return state.provider+'-'+(v.number||v.voiceId);}
function displayName(v){return state.provider==='sambert'?v.name:v.name;}
function displayId(v){return state.provider==='sambert'?v.model:v.voiceId;}

function matches(v){
  if(state.q){
    const hay=[v.name,v.model,v.voiceId,v.feature,v.scene,v.language,v.number].filter(Boolean).join(' ').toLowerCase();
    if(!hay.includes(state.q))return false;
  }
  for(const [group,vals] of Object.entries(state.filters)){
    if(!vals.size)continue;
    let ok=true;
    if(group==='lang')ok=vals.has(v.language);
    else if(group==='gender')ok=vals.has(genderOf(v));
    else if(group==='scene')ok=(v.sceneParts||[]).some(p=>vals.has(p));
    if(!ok)return false;
  }
  return true;
}

function buildFilters(){
  const data=dataFor();
  const groups=[];
  const langCount={};data.forEach(v=>langCount[v.language]=(langCount[v.language]||0)+1);
  groups.push({id:'lang',title:'语言',items:Object.entries(langCount).sort((a,b)=>b[1]-a[1])});
  if(state.provider==='sambert'){
    const g={男声:0,女声:0,童声:0};data.forEach(v=>{const k=genderOf(v);if(g[k]!=null)g[k]++;});
    groups.push({id:'gender',title:'声线',items:Object.entries(g)});
    const s={};data.forEach(v=>(v.sceneParts||[v.scene]).forEach(p=>{if(p)s[p]=(s[p]||0)+1;}));
    groups.push({id:'scene',title:'场景',items:Object.entries(s).sort((a,b)=>b[1]-a[1])});
  }
  const box=$('#filters');box.innerHTML='';
  for(const g of groups){
    const sec=document.createElement('div');sec.className='filter-group';
    sec.innerHTML=`<h3>${g.title}</h3>`;
    const chips=document.createElement('div');chips.className='chips';
    for(const [val,n] of g.items){
      const b=document.createElement('button');b.className='chip'+(state.filters[g.id]?.has(val)?' on':'');
      b.innerHTML=`${state.provider==='minimax'&&g.id==='lang'?(FLAG[val]||'')+' ':''}${val}<span class="n">${n}</span>`;
      b.onclick=()=>{
        const set=state.filters[g.id]||new Set();
        set.has(val)?set.delete(val):set.add(val);
        set.size?state.filters[g.id]=set:delete state.filters[g.id];
        buildFilters();render();
      };
      chips.appendChild(b);
    }
    sec.appendChild(chips);box.appendChild(sec);
  }
  if(Object.keys(state.filters).length){
    const c=document.createElement('button');c.className='clear-btn';c.textContent='清除全部筛选';
    c.onclick=()=>{state.filters={};buildFilters();render();};
    box.appendChild(c);
  }
}

function tagsHtml(v){
  if(state.provider==='sambert'){
    return [v.feature,v.scene,v.ssml?'SSML':null].filter(Boolean)
      .map((t,i)=>`<span class="tag${t==='SSML'?' green':''}">${t}</span>`).join('')+
      `<span class="tag green">免费</span>`;
  }
  return `<span class="tag">${v.language}</span><span class="tag amber">付费</span>`;
}

function rowHtml(v){
  const isS=state.provider==='sambert';
  const av=isS?`<div class="avatar ${avatarClass(genderOf(v))}">${v.name[0]}</div>`
    :`<div class="avatar a-lang">${FLAG[v.language]||'🌐'}</div>`;
  const idLine=isS
    ?`<div class="v-id">${v.model} · ${v.language}${v.sampleRate?' · '+v.sampleRate:''}</div>`
    :`<div class="v-id" title="${v.voiceId}">${v.voiceId}</div>`;
  const play=isS&&v.preview
    ?`<button class="play" data-act="play" title="试听官方样音"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg><span class="eq"><i></i><i></i><i></i></span></button>`
    :`<button class="play disabled" title="无页面内试听，可到官网试听"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></button>`;
  const copyTitle=isS?'复制模型 ID':'复制 voice_id';
  return `<div class="row" data-key="${keyFor(v)}">
    ${av}
    <div class="v-main">
      <div class="v-name">${isS?`<span class="v-num">${v.number}</span>`:''}${displayName(v)}</div>
      ${idLine}
    </div>
    <div class="v-tags">${tagsHtml(v)}</div>
    <div class="actions">
      ${play}
      <button class="icon-btn" data-act="copy" title="${copyTitle}"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
    </div>
  </div>`;
}

function render(){
  const data=dataFor();
  const list=data.filter(matches);
  $('#provider-title').textContent=state.provider==='sambert'?'Sambert 音色':'MiniMax 系统音色';
  $('#count').textContent=`${list.length} / ${data.length}`;
  $('#list').innerHTML=list.map(rowHtml).join('');
  $('#empty').hidden=list.length>0;
}

function stopAudio(){
  if(state.audio){state.audio.pause();state.audio=null;}
  if(state.playingBtn){state.playingBtn.closest('.row').classList.remove('playing');state.playingBtn=null;}
}

function togglePlay(btn,v){
  if(state.playingBtn===btn){stopAudio();return;}
  stopAudio();
  const a=new Audio(v.preview);state.audio=a;state.playingBtn=btn;
  btn.closest('.row').classList.add('playing');
  a.onended=()=>{stopAudio();};
  a.onerror=()=>{stopAudio();alert('试听加载失败，请检查网络（音频托管在阿里云 CDN）。');};
  a.play().catch(()=>{stopAudio();});
}

function copyText(t){
  if(navigator.clipboard&&window.isSecureContext!==false){
    return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));
  }
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
}

function select(v){
  state.selected={v,provider:state.provider};
  const isS=state.provider==='sambert';
  $('#d-name').innerHTML=`${isS?`<span class="v-num" style="margin-right:6px">${v.number}</span>`:''}${displayName(v)}<small>${displayId(v)}</small>`;
  const cmd=isS
    ?`node scripts/sambert.cjs --voice ${v.number} --text-file narration.txt --out narration.wav`
    :`node scripts/minimax.cjs --voice "${v.voiceId}" --text-file narration.txt --out narration.mp3`;
  $('#d-cmd').textContent=cmd;
  $('#d-note').innerHTML=isS
    ?`<span class="dot dot-free"></span>免费额度 · 仅 WAV · 默认 16 kHz`
    :`<span class="dot dot-paid"></span>付费 · hd ≈ $100 / 百万字符 · 输出 mp3`;
  $('#detail').classList.add('show');
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('selected',r.dataset.key===keyFor(v)));
}

document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  const row=e.target.closest('.row');
  if(act){
    const v=dataFor().find(x=>keyFor(x)===(row?.dataset.key));
    if(!v)return;
    if(act.dataset.act==='play')togglePlay(act,v);
    if(act.dataset.act==='copy'){copyText(displayId(v));act.title='已复制 ✓';setTimeout(()=>act.title='复制',900);}
    return;
  }
  if(row){
    const v=dataFor().find(x=>keyFor(x)===row.dataset.key);
    if(v)select(v);
  }
});
$('#d-close').onclick=()=>{state.selected=null;$('#detail').classList.remove('show');document.querySelectorAll('.row.selected').forEach(r=>r.classList.remove('selected'));};
$('#d-copy').onclick=()=>{copyText($('#d-cmd').textContent);const b=$('#d-copy');b.textContent='已复制 ✓';setTimeout(()=>b.textContent='复制命令',900);};
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();render();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){stopAudio();$('#d-close').onclick();}
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}
});
function switchProvider(p){
  if(state.provider===p)return;
  stopAudio();state.provider=p;state.filters={};state.selected=null;
  $('#detail').classList.remove('show');
  $('#tab-sambert').classList.toggle('active',p==='sambert');
  $('#tab-minimax').classList.toggle('active',p==='minimax');
  buildFilters();render();
}
$('#tab-sambert').onclick=()=>switchProvider('sambert');
$('#tab-minimax').onclick=()=>switchProvider('minimax');

$('#gen-date').textContent=new Date().toISOString().slice(0,10);
buildFilters();render();
</script>
