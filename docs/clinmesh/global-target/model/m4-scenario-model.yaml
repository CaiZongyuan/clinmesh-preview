domain: GlobalMiniHIS
event_scenarios:
  - id: WalkIn
    name: 无收费门诊的现场接诊
    description: 院内网络可用，公网不可用；无床、无药房、无收费。
    sourceObjectRef: Visit
    targetObjectRefs:
      - Contact
      - ClinicalNote
    involvedAggregates:
      - Visit
      - Contact
      - ClinicalNote
    triggerBehaviorRef: visit.start
    triggerEventRef: VisitOpened
    steps:
      - stepOrder: 1
        stepType: BEHAVIOR_CALL
        refId: contact.record
        targetAggregate: Contact
        description: 同次来院追加护士或医生各自的实际接触、发生与录入时间，不重挂号。
      - stepOrder: 2
        stepType: BEHAVIOR_CALL
        refId: note.sign
        targetAggregate: ClinicalNote
        description: 经治医生签署具体修订，记录诊断判断、处置计划与签署身份。
      - stepOrder: 3
        stepType: BEHAVIOR_CALL
        refId: visit.end
        targetAggregate: Visit
        description: 离诊不会删除未回申请、待阅报告或随访责任。
  - id: LateResult
    name: 患者离诊后外送报告次日返回
    description: 此前已有申请；后续行动只在责任医生判断有需要时建立。
    sourceObjectRef: Visit
    targetObjectRefs:
      - InboundResult
      - Report
      - FollowUp
    involvedAggregates:
      - Visit
      - InboundResult
      - Report
      - FollowUp
    triggerBehaviorRef: visit.end
    triggerEventRef: VisitEnded
    steps:
      - stepOrder: 1
        stepType: BEHAVIOR_CALL
        refId: inbound.receive
        targetAggregate: InboundResult
        description: 人工按来源登记或由同一核对流程接收外部消息；待核件不是已签发的本院报告。
      - stepOrder: 2
        stepType: BEHAVIOR_CALL
        refId: inbound.match
        targetAggregate: InboundResult
        description: 确认唯一匹配，无法匹配继续隔离，不污染临床病历。
      - stepOrder: 3
        stepType: BEHAVIOR_CALL
        refId: report.file
        targetAggregate: Report
        description: 登记来源方已经签发的结果，保留外院签发身份；本次登记不代替医生确认已阅。
      - stepOrder: 4
        stepType: BEHAVIOR_CALL
        refId: report.ack
        targetAggregate: Report
        description: 仅记录当前版本已阅；医生判断是否另建后续行动。
      - stepOrder: 5
        stepType: BEHAVIOR_CALL
        refId: follow.assign
        targetAggregate: FollowUp
        description: 对需要复查、转诊或患者联系的事项建立单独任务。
  - id: Correction
    name: 报告更正后重阅并核对既有行动
    description: 已阅的是旧版本，先重阅再决定是否更改行动。
    sourceObjectRef: Report
    targetObjectRefs:
      - FollowUp
    involvedAggregates:
      - Report
      - FollowUp
    triggerBehaviorRef: report.amend
    triggerEventRef: ResultAmended
    steps:
      - stepOrder: 1
        stepType: BEHAVIOR_CALL
        refId: report.ack
        targetAggregate: Report
        description: 仅记录当前版本已阅；医生判断是否另建后续行动。
      - stepOrder: 2
        stepType: BEHAVIOR_CALL
        refId: queue.follow
        targetAggregate: FollowUp
        description: 按责任人和约定期限筛选；完成须以任务结果而非报告状态判定。
  - id: UnpaidDeparture
    name: 欠费离院后按政策释放床位
    description: 收费配置允许保留应收后释放；护理岗位不读取逐项明细，由各责任岗位执行。
    sourceObjectRef: Stay
    targetObjectRefs:
      - Account
    involvedAggregates:
      - Stay
      - Account
    triggerBehaviorRef: stay.depart
    triggerEventRef: StayDeparted
    steps:
      - stepOrder: 1
        stepType: BEHAVIOR_CALL
        refId: queue.funds
        targetAggregate: Account
        description: 区分逐项应收、确定净收及待核尝试；按币种展示。
      - stepOrder: 2
        stepType: BEHAVIOR_CALL
        refId: stay.release
        targetAggregate: Stay
        description: 仅结束床位占用；不改费用余额。
