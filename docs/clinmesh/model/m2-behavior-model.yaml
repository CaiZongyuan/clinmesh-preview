model_type: BEHAVIOR
version: '5.0'
domain: ClinMesh
behaviors:
  - {id: admin.authored-case-pack.prepare, requiredPermissions: [P-admin.authored-case-pack.prepare], name: PrepareCasePack, alias: 准备就绪病例, ownerEntity: Case, behaviorType: COMMAND, invokedRules: [no-truth-leak], description: 准备来源与选用的角色稿；不生成本院诊断、医嘱或费用。}
  - {id: registration.synthetic-case.start, requiredPermissions: [P-registration.synthetic-case.start], name: RegisterCase, alias: 为就绪病例挂门诊号, ownerEntity: Registration, behaviorType: COMMAND, invokedRules: [case-once], producedEvents: [Registered], description: 原子建立本院患者关联、挂号、就诊、候诊任务及挂号应收。同一病例的第二次普通开始被拒绝。}
  - {id: registration.synthetic-case.start-inpatient, requiredPermissions: [P-registration.synthetic-case.start-inpatient], name: AdmitCaseDirectly, alias: 就绪病例直接住院登记, ownerEntity: Admission, behaviorType: COMMAND, invokedRules: [case-once], description: 选择接收病区，不建门诊号、不收挂号费；尚未分床。}
  - {id: triage.record, requiredPermissions: [P-triage.record], name: RecordTriage, alias: 完成分诊, ownerEntity: Encounter, behaviorType: COMMAND, description: 留存分诊初记和测量，交给医生候诊队列；医生工作稿不覆盖护士初记。}
  - {id: encounter.consultation.ask, requiredPermissions: [P-encounter.consultation.ask], name: AskPatient, alias: 向本次患者问诊, ownerEntity: Encounter, behaviorType: COMMAND, invokedRules: [no-truth-leak], description: 记录经治医生发言；患者回答另行形成，不以隐藏真值代替自述。}
  - {id: encounter.diagnosis.confirm, requiredPermissions: [P-encounter.diagnosis.confirm], name: ConfirmDiagnosis, alias: 确认门诊主次诊断, ownerEntity: Diagnosis, behaviorType: COMMAND, invokedRules: [diagnosis-primary], description: 以当前草稿修订确认整组诊断；更新当前引用而非删除历史。}
  - {id: encounter.laboratory-request.issue, requiredPermissions: [P-encounter.laboratory-request.issue], name: IssueLabRequest, alias: 签发门诊检验, ownerEntity: Investigation, behaviorType: COMMAND, invokedRules: [prepaid-release], description: 冻结服务与应收；申请成功并不代表已收费或已出结果。}
  - {id: laboratory-report.acknowledge, requiredPermissions: [P-laboratory-report.acknowledge], name: AcknowledgeLabReport, alias: 确认检验报告已阅, ownerEntity: Report, behaviorType: COMMAND, invokedRules: [latest-report], description: 责任医生确认具体报告修订；更正后须重阅。}
  - {id: encounter.prescription.issue, requiredPermissions: [P-encounter.prescription.issue], name: IssuePrescription, alias: 正式开具门诊处方, ownerEntity: Prescription, behaviorType: COMMAND, invokedRules: [prescription-safety], description: 按整单来源核验诊断、药物组合和用法；外延处方不进入本院调剂链。}
  - {id: encounter.medication-conclusion.confirm-none, requiredPermissions: [P-encounter.medication-conclusion.confirm-none], name: ConfirmNoMedication, alias: 明确记录无需用药, ownerEntity: Encounter, behaviorType: COMMAND, description: 用独立结论满足本次门诊用药决策，不生成空处方、药费或药房任务。}
  - {id: document.sign, requiredPermissions: [P-document.sign], name: SignDocument, alias: 签署结构化病历, ownerEntity: Document, behaviorType: COMMAND, producedEvents: [Signed], description: 经治医生确认冻结的签署预览，产生不可覆盖的正式文书；不执行门诊完诊。源命令 clinical-document.sign。}
  - {id: encounter.complete, requiredPermissions: [P-encounter.complete], name: CompleteVisit, alias: 办理门诊完诊, ownerEntity: Encounter, behaviorType: COMMAND, invokedRules: [completion-gates], description: 服务端重验完诊清单及适用临床质控，结束本次临床责任，不代收药费或代发药。}
  - {id: payment.confirm, requiredPermissions: [P-payment.confirm], name: ConfirmPayment, alias: 确认门诊原费用收款, ownerEntity: Payment, behaviorType: COMMAND, invokedRules: [tender-recovery], description: 使用已审阅的预览和支付方式提交；以原支付尝试的确定结果入账。}
  - {id: payment.recover, requiredPermissions: [P-payment.recover], name: RecoverPayment, alias: 查询原收款结果, ownerEntity: Payment, behaviorType: COMMAND, invokedRules: [tender-recovery], description: 恢复原尝试，不换新意图收第二次款。}
  - {id: insurance.confirm, requiredPermissions: [P-insurance.confirm], name: ConfirmBenefit, alias: 确认患者门诊待遇分摊, ownerEntity: Benefit, behaviorType: COMMAND, description: 确认合成待遇预览；改变本次费用分摊，不等于到账或医院侧核定。}
  - {id: prescription.review, requiredPermissions: [P-prescription.review], name: ReviewPrescription, alias: 药师审方, ownerEntity: Prescription, behaviorType: COMMAND, description: 已付费的本院处方进入药房审方；审方本身不产生库存移动。}
  - {id: prescription.dispense, requiredPermissions: [P-prescription.dispense], name: DispensePrescription, alias: 按批次调剂发药, ownerEntity: Prescription, behaviorType: COMMAND, producedEvents: [Dispensed], description: 核对审方、批次版本与剩余数量，成功才计实际发放及出库。}
  - {id: inpatient.admission.receive, requiredPermissions: [P-inpatient.admission.receive], name: ReceiveAdmission, alias: 护士接诊分床, ownerEntity: Admission, behaviorType: COMMAND, invokedRules: [bed-exclusive], description: 在接收病区为已登记患者分配可用床位；与另一次分配竞争不能形成双占。}
  - {id: inpatient.diagnosis.confirm, requiredPermissions: [P-inpatient.diagnosis.confirm], name: ConfirmInpatientDiagnosis, alias: 确认住院诊断与入院病情, ownerEntity: Diagnosis, behaviorType: COMMAND, invokedRules: [diagnosis-primary], description: 医生保存本次住院主次诊断与入院病情；不是医保办选择病组。}
  - {id: inpatient.order.issue, requiredPermissions: [P-inpatient.order.issue], name: IssueWardOrder, alias: 签发住院医嘱, ownerEntity: Order, behaviorType: COMMAND, description: 记录本次住院的长期或临时医嘱、执行频次及有效版本，交护士校对。}
  - {id: inpatient.order.verify, requiredPermissions: [P-inpatient.order.verify], name: VerifyOrder, alias: 校对住院医嘱, ownerEntity: Order, behaviorType: COMMAND, invokedRules: [order-verified], description: 校对生效后按规则派生执行任务；按需项目不自动执行。}
  - {id: inpatient.execution.dispense, requiredPermissions: [P-inpatient.execution.dispense], name: DispenseWardDose, alias: 为住院执行单发药, ownerEntity: Execution, behaviorType: COMMAND, description: 选批次发药并登记库存变化，不产生护士给药记录。}
  - {id: inpatient.execution.administer, requiredPermissions: [P-inpatient.execution.administer], name: AdministerWardDose, alias: 护士记录实际给药, ownerEntity: Execution, behaviorType: COMMAND, invokedRules: [dispense-before-dose], description: 针对具体执行时点记录实际给药，保留护士与本次执行身份。}
  - {id: inpatient.surgery.record-material, requiredPermissions: [P-inpatient.surgery.record-material], name: RecordMaterialUse, alias: 登记术中实际耗材, ownerEntity: Surgery, behaviorType: COMMAND, invokedRules: [actual-material], description: 逐笔登记本次实施所用材料；不以预估、计划或预留代替实际使用。}
  - {id: inpatient.surgery.complete, requiredPermissions: [P-inpatient.surgery.complete], name: CompleteSurgery, alias: 核实完成本次手术, ownerEntity: Surgery, behaviorType: COMMAND, invokedRules: [actual-material], description: 按已审阅的实施内容与材料集合完成；保留实际术式与材料依据。}
  - {id: inpatient.discharge.issue, requiredPermissions: [P-inpatient.discharge.issue], name: OrderDischarge, alias: 开出院医嘱, ownerEntity: Admission, behaviorType: COMMAND, invokedRules: [discharge-ready], description: 进入待出院；此时仍保留原床，不自动办理出区。}
  - {id: inpatient.discharge.depart, requiredPermissions: [P-inpatient.discharge.depart], name: RecordDeparture, alias: 记录实际出区, ownerEntity: Admission, behaviorType: COMMAND, invokedRules: [discharge-ready], producedEvents: [Departed], description: 核对在途事项及医嘱执行状态，记录实际离开和离院方式；原床暂留。}
  - {id: inpatient.discharge.recall, requiredPermissions: [P-inpatient.discharge.recall], name: RecallAdmission, alias: 召回已出区患者, ownerEntity: Admission, behaviorType: COMMAND, invokedRules: [recall-window], description: 在出区且未结算的保床窗口追加逆向事实；不重启已停医嘱。}
  - {id: inpatient.discharge.settle, requiredPermissions: [P-inpatient.discharge.settle], name: SettleAdmission, alias: 首次封住院账, ownerEntity: Settlement, behaviorType: COMMAND, invokedRules: [settlement-frozen, tender-recovery], description: 按展示过的逐项费用与资金重验，冻结首次结算；不释放床位。}
  - {id: inpatient.discharge.clear, requiredPermissions: [P-inpatient.discharge.clear], name: ReleaseBed, alias: 结算后清床, ownerEntity: Bed, behaviorType: COMMAND, invokedRules: [bed-exclusive], description: 护士结束领域床位占用，使床可再分配；并不等于归档。}
  - {id: inpatient.record.submit, requiredPermissions: [P-inpatient.record.submit], name: SubmitRecord, alias: 提交病案首页修订, ownerEntity: Record, behaviorType: COMMAND, description: 保存当前来源并明确本次实际主操作；在院推演的修订不等于正式归档件。}
  - {id: inpatient.record.review, requiredPermissions: [P-inpatient.record.review], name: ReviewRecord, alias: 审核或退回病案首页, ownerEntity: Record, behaviorType: COMMAND, description: 病案人员核对编码与来源；退回须注明原因，不能代医生改正式诊断。}
  - {id: inpatient.record.archive, requiredPermissions: [P-inpatient.record.archive], name: ArchiveRecord, alias: 冻结归档, ownerEntity: Record, behaviorType: COMMAND, invokedRules: [archive-freeze], producedEvents: [Archived], description: 已清床、结算并获当前审核批准，才冻结首页和当时的分组结果。}
  - {id: inpatient.drg.payer.review, requiredPermissions: [P-inpatient.drg.payer.review], name: ReviewPayerEstimate, alias: 医保办模拟核定, ownerEntity: PayerReview, behaviorType: COMMAND, invokedRules: [payer-separated], description: 根据归档冻结依据及核定参数重验预览；与原预估对账，不改患者分摊。}
  - {id: triage.queue.list, requiredPermissions: [P-triage.queue.list], name: ListTriageQueue, alias: 查看分诊队列, ownerEntity: Registration, behaviorType: QUERY, queryReportRef: Q-triage}
  - {id: encounter.completion.preview, requiredPermissions: [P-encounter.completion.preview], name: ReadVisitGates, alias: 核对完诊条件, ownerEntity: Encounter, behaviorType: QUERY, queryReportRef: Q-completion}
  - {id: pharmacy.queue.list, requiredPermissions: [P-pharmacy.queue.list], name: ListPharmacyQueue, alias: 查看门诊调剂队列, ownerEntity: Prescription, behaviorType: QUERY, queryReportRef: Q-pharmacy}
  - {id: inpatient.admission.list, requiredPermissions: [P-inpatient.admission.list], name: ListAdmissions, alias: 查看岗位住院清单, ownerEntity: Admission, behaviorType: QUERY, queryReportRef: Q-admissions}
  - {id: inpatient.discharge.preview, requiredPermissions: [P-inpatient.discharge.preview], name: PreviewSettlement, alias: 核对住院首次结算明细, ownerEntity: Settlement, behaviorType: QUERY, queryReportRef: Q-settlement}
  - {id: inpatient.drg.payer.reviews, requiredPermissions: [P-inpatient.drg.payer.reviews], name: ReadPayerReviews, alias: 查阅医保核定和差额, ownerEntity: PayerReview, behaviorType: QUERY, queryReportRef: Q-payer}
